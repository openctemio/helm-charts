name: Lint and Template

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Actions are pinned to commit SHAs
        run: bash .github/scripts/check-action-pins.sh

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3
      
      - name: Resolve chart dependencies
        run: |
          for chart in charts/*; do
            if [ -d "$chart" ]; then
              echo "Resolving dependencies for $chart"
              helm dependency update "$chart"
            fi
          done

      - name: Lint charts
        run: |
          # Lint in dev/eval mode: api.appEnv=production is a fail-closed gate
          # that requires stable secrets, so a bare lint could error depending
          # on the helm version. Production posture is separately linted via the
          # values-production render/assert steps below.
          for chart in charts/*; do
            if [ -d "$chart" ]; then
              echo "Linting $chart"
              helm lint "$chart" --set api.appEnv=development
            fi
          done

      - name: Render templates (dev/eval mode)
        run: |
          # The openctem chart is secure-by-default: api.appEnv=production is a
          # fail-closed gate that REQUIRES a stable APP_ENCRYPTION_KEY /
          # AUTH_JWT_SECRET (see values-production.yaml). A bare production
          # render is therefore expected to fail, so smoke-render in dev/eval
          # mode (bundled datastores, auto-generated secrets).
          for chart in charts/*; do
            if [ -d "$chart" ]; then
              echo "Rendering $chart (dev/eval mode)"
              helm template "$chart" --set api.appEnv=development > /dev/null
            fi
          done

      - name: Sensor values migration (agent -> sensor)
        run: |
          # Old `agent:` values files keep rendering as the sensor, conflicts
          # with `sensor:` fail, the API's AGENT_* settings are renamed, and
          # the defaults copy in _helpers.tpl matches values.yaml.
          tests/sensor-migration/run.sh

      - name: Sensor hardening and local policy (render checks)
        run: |
          # The bundled sensor runs non-root with a read-only root filesystem,
          # no capabilities and seccomp; sensor.localPolicy renders the
          # read-only policy mount (OpenCTEM RFC-040).
          tests/sensor-hardening/run.sh

      - name: Attachment storage (render checks)
        run: |
          # api.attachments: default RWO volume (Recreate), S3, RWX with
          # several replicas, and the multi-replica-on-RWO/emptyDir refusals.
          tests/attachments/run.sh

      - name: Organization bootstrap (render checks)
        run: |
          # api.tenantCreationMode, the bootstrap-admin Job (no shell, no
          # failure swallowing, kept for its one-time credentials, org flags),
          # and the removed api.bootstrapTenant failing with a pointer.
          tests/bootstrap/run.sh

      - name: Least-privilege database roles (render checks)
        run: |
          # database.migrator: migration Jobs use the schema owner, the API
          # keeps the DML-only database.auth role (D-6).
          tests/least-privilege/run.sh

      - name: Single-port gateway (render checks)
        run: |
          # gateway.mode ingress | httpRoute | caddy: routes, refusals, the
          # API/UI settings, NetworkPolicy, and that the chart's API path list
          # matches files/gateway/Caddyfile.
          tests/gateway/run.sh

      - name: Single-port gateway (bundled Caddy in Docker)
        run: |
          # Runs the rendered Caddy (internal, files, http TLS modes) in front
          # of stub API/UI upstreams and checks the routing over real HTTPS.
          tests/gateway/caddy-smoke.sh

      - name: Default image tags are released
        run: |
          # appVersion (API, web and migrations images) must be a released
          # OpenCTEM tag and sensor.image.tag a released sensor tag. Warning
          # only while chart 0.5.0+ waits for OpenCTEM v0.9.0; set STRICT=1
          # once it is tagged (openctemio/openctem RFC-037).
          tests/versions/run.sh
          tests/versions/check-published.sh

      - name: Render templates (production values)
        run: |
          # Production values file provides the required secrets -> must render.
          helm template charts/openctem -f charts/openctem/values-production.yaml > /dev/null

      - name: Assert production fail-closed without secrets
        run: |
          # With api.appEnv=production and no encryption key / JWT secret /
          # existingSecret, the render MUST fail (GitOps anti-rotation guard).
          if helm template charts/openctem > /dev/null 2>&1; then
            echo "::error::Expected production render to FAIL without secrets, but it succeeded"
            exit 1
          fi
          echo "OK: production render is correctly fail-closed without secrets"

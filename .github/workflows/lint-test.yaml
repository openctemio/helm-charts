name: Lint and Template

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Actions are pinned to commit SHAs
        run: bash .github/scripts/check-action-pins.sh

      - name: Customer identifiers (self-test)
        run: bash .github/scripts/check-customer-identifiers.test.sh >/dev/null

      # Fails when a tracked file names a customer (case-insensitive fixed
      # strings from the CUSTOMER_DENYLIST secret, so the list is never
      # committed) or carries the live LAN range outside tests. Prints only
      # file:line. Passes with a notice when the secret is empty (forks).
      - name: Customer identifiers
        env:
          CUSTOMER_DENYLIST: ${{ secrets.CUSTOMER_DENYLIST }}
        run: bash .github/scripts/check-customer-identifiers.sh


      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3
      
      - name: Resolve chart dependencies
        run: |
          for chart in charts/*; do
            if [ -d "$chart" ]; then
              echo "Resolving dependencies for $chart"
              helm dependency update "$chart"
            fi
          done

      - name: Lint charts
        run: |
          # Lint in dev/eval mode: api.appEnv=production is a fail-closed gate
          # that requires stable secrets, so a bare lint could error depending
          # on the helm version. Production posture is separately linted via the
          # values-production render/assert steps below.
          for chart in charts/*; do
            if [ -d "$chart" ]; then
              echo "Linting $chart"
              helm lint "$chart" --set api.appEnv=development
            fi
          done

      - name: Render templates (dev/eval mode)
        run: |
          # The openctem chart is secure-by-default: api.appEnv=production is a
          # fail-closed gate that REQUIRES a stable APP_ENCRYPTION_KEY /
          # AUTH_JWT_SECRET (see values-production.yaml). A bare production
          # render is therefore expected to fail, so smoke-render in dev/eval
          # mode (bundled datastores, auto-generated secrets).
          for chart in charts/*; do
            if [ -d "$chart" ]; then
              echo "Rendering $chart (dev/eval mode)"
              helm template "$chart" --set api.appEnv=development > /dev/null
            fi
          done

      - name: Sensor values migration (agent -> sensor)
        run: |
          # Old `agent:` values files keep rendering as the sensor, conflicts
          # with `sensor:` fail, the API's AGENT_* settings are renamed, and
          # the defaults copy in _helpers.tpl matches values.yaml.
          tests/sensor-migration/run.sh

      - name: Sensor hardening and local policy (render checks)
        run: |
          # The bundled sensor runs non-root with a read-only root filesystem,
          # no capabilities and seccomp; sensor.localPolicy renders the
          # read-only policy mount (OpenCTEM RFC-040).
          tests/sensor-hardening/run.sh

      - name: Attachment storage (render checks)
        run: |
          # api.attachments: default RWO volume (Recreate), S3, RWX with
          # several replicas, and the multi-replica-on-RWO/emptyDir refusals.
          tests/attachments/run.sh

      - name: Organization bootstrap (render checks)
        run: |
          # api.tenantCreationMode, the bootstrap-admin Job (no shell, no
          # failure swallowing, kept for its one-time credentials, org flags),
          # and the removed api.bootstrapTenant failing with a pointer.
          tests/bootstrap/run.sh

      - name: Gateway files are the OpenCTEM gateway's (upstream sync)
        run: |
          # files/gateway/{Caddyfile,planes.caddy,entrypoint.sh} must equal
          # openctemio/openctem api/deploy/gateway at the commit pinned in
          # files/gateway/UPSTREAM (scripts/sync-gateway.sh writes both), and
          # a warning says when that commit is behind openctem develop.
          LATEST_REF=develop tests/gateway/upstream.sh

      - name: Operator monitoring (render checks)
        run: |
          # monitoring.*: the API metrics token, ServiceMonitor, PrometheusRule
          # (and that its rules file equals the OpenCTEM commit in
          # files/monitoring/UPSTREAM), the NetworkPolicy opening for Prometheus.
          tests/monitoring/run.sh

      - name: Least-privilege database roles (render checks)
        run: |
          # database.migrator: migration Jobs use the schema owner, the API
          # keeps the DML-only database.auth role.
          tests/least-privilege/run.sh

      - name: Single-port gateway (render checks)
        run: |
          # gateway.mode ingress | httpRoute | caddy: routes, refusals, the
          # API/UI settings, NetworkPolicy, and that the chart's API path list
          # is files/gateway/planes.caddy's.
          tests/gateway/run.sh

      - name: Sensor protocol v3 (render checks)
        run: |
          # OpenCTEM RFC-059: off by default; API settings, mTLS port, sensor
          # CA, gateway passthrough, dedicated Service, NetworkPolicy.
          tests/sensor-transport/run.sh

      - name: Single-port gateway (bundled Caddy in Docker)
        run: |
          # Runs the rendered Caddy (internal, files, http TLS modes) in front
          # of stub API/UI upstreams and checks the routing over real HTTPS.
          tests/gateway/caddy-smoke.sh

      - name: Default image tags are released
        run: |
          # appVersion (API, web and migrations images) must be a released
          # OpenCTEM tag and sensor.image.tag a released sensor tag. Warning
          # only while chart 0.5.0+ waits for OpenCTEM v0.9.0; set STRICT=1
          # once it is tagged (openctemio/openctem RFC-037).
          tests/versions/run.sh
          tests/versions/check-published.sh

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.6.7
          KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
        run: |
          curl -fsSLo /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Kubernetes schema checks (kubeconform)
        run: |
          # Representative renders validated against the Kubernetes API
          # schemas, strict (unknown fields fail).
          tests/kubeconform/run.sh

      - name: Render templates (production values)
        run: |
          # Production values file provides the required secrets -> must render.
          helm template charts/openctem -f charts/openctem/values-production.yaml > /dev/null

      - name: Assert production fail-closed without secrets
        run: |
          # With api.appEnv=production and no encryption key / JWT secret /
          # existingSecret, the render MUST fail (GitOps anti-rotation guard).
          if helm template charts/openctem > /dev/null 2>&1; then
            echo "::error::Expected production render to FAIL without secrets, but it succeeded"
            exit 1
          fi
          echo "OK: production render is correctly fail-closed without secrets"

  kind-install:
    # Installs the chart on a kind cluster: the bundled datastores become
    # ready, and the bundled sensor pairs, adopts the nuclei-templates baked
    # into its image, and keeps its identity 0600 across a pod replacement
    # (tests/kind/run.sh).
    runs-on: ubuntu-latest
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.34.1
      KUBECTL_SHA256: 7721f265e18709862655affba5343e85e1980639395d5754473dafaadcaa69e3
      KIND_CLUSTER: chart-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3

      - name: Install kind and kubectl
        run: |
          curl -fsSLo /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum -c -
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /tmp/kubectl /usr/local/bin/

      - name: Create the cluster
        run: kind create cluster --name "$KIND_CLUSTER" --wait 120s

      - name: Resolve chart dependencies
        run: helm dependency build charts/openctem

      - name: Install smoke test
        run: tests/kind/run.sh

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n openctem-smoke describe pods
          kubectl -n openctem-smoke logs deploy/smoke-openctem-sensor --all-containers || true

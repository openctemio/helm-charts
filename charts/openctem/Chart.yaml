apiVersion: v2
name: openctem
description: "OpenCTEM (Continuous Threat Exposure Management) platform: the API, the web console, database migrations and an optional co-located scanning sensor, plus optional PostgreSQL and Redis for evaluation."

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application
home: https://openctem.io
icon: https://docs.openctem.io/brand/app-icon.svg
sources:
  - https://github.com/openctemio/helm-charts
  - https://github.com/openctemio/openctem
keywords:
  - security
  - ctem
  - exposure-management
  - vulnerability-management
maintainers:
  - name: OpenCTEM
    email: info@openctem.io
    url: https://openctem.io
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: fixed
      description: "sensor.enrollment=instance sets SENSOR_SHARED_MODE=1: a sensor enrolled at instance scope stopped at start (sdk-go v0.35.0 and later) after spending its single-use token, then crash-looped"
    - kind: security
      description: "BREAKING for sensor.enrollment=instance: the render fails without sensor.sandbox.network=required, the sensor's seccomp profile and sensor.localPolicy.enabled=true, which shared mode requires"
    - kind: security
      description: "The instance enrollment token reaches the sensor as a read-only file (SENSOR_INSTANCE_ENROLLMENT_TOKEN_FILE), never the environment"
    - kind: security
      description: "sensor.networkPolicy (on by default): the sensor pod accepts no connection and reaches only DNS, the API, the bundled gateway and public addresses (no datastores, cluster ranges or cloud metadata); the PostgreSQL and Redis policies exclude the sensor"
    - kind: changed
      description: "Bundled sensor v0.35.0"
    - kind: changed
      description: "Default sensor resources: requests 500m CPU / 1Gi memory, limits 2 CPU / 2Gi"

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.36.0

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "v0.12.0"

# NOTE: the bundled Bitnami Postgres/Redis subcharts below are for DEV / EVAL
# ONLY. Production must use external managed datastores (postgresql.enabled=false,
# redis.enabled=false) — see values-production.yaml and README. Bitnami has
# deprecated its free Docker Hub images, so the bundled path carries a
# supply-chain risk that external managed datastores avoid.
#
# Versions are PINNED to exact releases (not floating x-ranges) for reproducible
# builds; bump deliberately and re-run `helm dependency update`.
dependencies:
  - name: postgresql
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 18.5.6
    condition: postgresql.enabled
  - name: redis
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 25.3.2
    condition: redis.enabled

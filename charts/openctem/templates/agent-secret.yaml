{{- if and .Values.agent.enabled (not .Values.agent.existingSecret) }}
{{- if not .Values.agent.bootstrapToken }}
{{- fail "agent.enabled=true requires either agent.bootstrapToken or agent.existingSecret (a bootstrap token is needed for the bundled agent to self-register)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-bootstrap" (include "openctem.agentFullname" .) }}
  labels:
    {{- include "openctem.agentLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.agent.existingSecretKey | default "bootstrap-token" }}: {{ .Values.agent.bootstrapToken | quote }}
{{- end }}

{{- if .Values.admin.listener.enabled }}
# The API's platform console listener (ADMIN_LISTEN_ADDR): reached only by the
# console service (ADMIN_API_URL); never routed by a gateway or ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openctem.apiFullname" . }}-admin
  labels:
    {{- include "openctem.apiLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: admin
      port: {{ .Values.admin.listener.port }}
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "openctem.apiSelectorLabels" . | nindent 4 }}
{{- end }}

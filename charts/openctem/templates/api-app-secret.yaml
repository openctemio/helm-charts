{{/*
Chart-managed API application secret: APP_ENCRYPTION_KEY (integration
credential encryption, AES-256-GCM) and AUTH_JWT_SECRET (session/JWT signing).

Both values are generate-once-and-PERSIST: the existing Secret is looked up on
the cluster and its value reused on every upgrade, so neither key is ever
rotated automatically. Rotating APP_ENCRYPTION_KEY makes all stored integration
credentials undecryptable; rotating AUTH_JWT_SECRET logs every user out — so
persistence is load-bearing, not cosmetic.

For fully deterministic, externally-managed secrets (recommended in production)
set api.encryption.existingSecret / api.auth.existingSecret, or provide explicit
api.encryption.key / api.auth.jwtSecret values.
*/}}
{{- if or (not .Values.api.encryption.existingSecret) (not .Values.api.auth.existingSecret) }}
{{- $secretName := include "openctem.apiAppSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "openctem.apiLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.api.encryption.existingSecret }}
  APP_ENCRYPTION_KEY: {{ include "openctem.apiEncryptionKeyValue" (dict "context" . "existingSecret" $existing) | quote }}
  {{- end }}
  {{- if not .Values.api.auth.existingSecret }}
  AUTH_JWT_SECRET: {{ include "openctem.apiJwtSecretValue" (dict "context" . "existingSecret" $existing) | quote }}
  {{- end }}
{{- end }}

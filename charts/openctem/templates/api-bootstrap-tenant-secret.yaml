{{/*
Holds the initial tenant-owner password for the bootstrap-tenant Job when it is
not supplied via api.bootstrapTenant.passwordExistingSecret. Prefer an existing
secret in production; the inline value is a convenience for demos.
*/}}
{{- if and .Values.api.bootstrapTenant.enabled (not .Values.api.bootstrapTenant.passwordExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openctem.apiFullname" . }}-bootstrap-tenant
  labels:
    {{- include "openctem.apiLabels" . | nindent 4 }}
type: Opaque
stringData:
  TENANT_PASSWORD: {{ required "api.bootstrapTenant.password (or passwordExistingSecret) is required when api.bootstrapTenant.enabled=true" .Values.api.bootstrapTenant.password | quote }}
{{- end }}

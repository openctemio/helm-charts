{{- if and (not .Values.postgresql.enabled) .Values.database.auth.createSecret (not .Values.database.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openctem.dbCredentialsSecretName" . }}
  labels:
    {{- include "openctem.apiLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.auth.userKey }}: {{ .Values.database.auth.username | quote }}
  {{ .Values.database.auth.passwordKey }}: {{ .Values.database.auth.password | quote }}
  {{- if and .Values.database.migrator.username (not .Values.database.migrator.existingSecret) }}
  {{ .Values.database.migrator.userKey }}: {{ .Values.database.migrator.username | quote }}
  {{ .Values.database.migrator.passwordKey }}: {{ required "database.migrator.password is required when database.migrator.username is set" .Values.database.migrator.password | quote }}
  {{- end }}
  {{- if and .Values.database.console.username (not .Values.database.console.existingSecret) }}
  {{ .Values.database.console.userKey }}: {{ .Values.database.console.username | quote }}
  {{ .Values.database.console.passwordKey }}: {{ required "database.console.password is required when database.console.username is set" .Values.database.console.password | quote }}
  {{- end }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
{{- $dbSecretChecksumSource := include "openctem.dbSecretChecksumSource" . | trim }}
{{- $redisSecretChecksumSource := include "openctem.redisSecretChecksumSource" . | trim }}
{{- include "openctem.apiAttachmentsValidate" . }}
{{- include "openctem.apiReplicasValidate" . }}
{{- include "openctem.datastoresValidate" . }}
{{- $redisCa := include "openctem.redisCaEnabled" . }}
metadata:
  name: {{ include "openctem.apiFullname" . }}
  labels:
    {{- include "openctem.apiLabels" . | nindent 4 }}
spec:
  {{- if .Values.api.deploymentStrategy }}
  strategy:
    {{- toYaml .Values.api.deploymentStrategy | nindent 4 }}
  {{- else if include "openctem.apiAttachmentsRwoVolume" . }}
  # The attachments volume is ReadWriteOnce: a rolling update could start the
  # new pod on another node, where it cannot attach the volume.
  strategy:
    type: Recreate
  {{- end }}
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openctem.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $dbSecretChecksumSource }}
        checksum/db-secret: {{ $dbSecretChecksumSource | sha256sum }}
        {{- end }}
        {{- if $redisSecretChecksumSource }}
        checksum/redis-secret: {{ $redisSecretChecksumSource | sha256sum }}
        {{- end }}
        {{- if .Values.api.migrations.enabled }}
        checksum/migrations-job: {{ include (print $.Template.BasePath "/api-migrations-job.yaml") . | sha256sum }}
        {{- end }}
        {{- if or (not .Values.api.encryption.existingSecret) (not .Values.api.auth.existingSecret) }}
        checksum/app-secret: {{ include (print $.Template.BasePath "/api-app-secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "openctem.apiLabels" . | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openctem.apiServiceAccountName" . }}
      automountServiceAccountToken: {{ .Values.api.serviceAccount.automount }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          {{- with .Values.api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "openctem.image" (dict "image" .Values.api.image "root" . "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.admin.listener.enabled }}
            # The platform console API (ADMIN_LISTEN_ADDR): the <api>-admin
            # Service, for the console service only.
            - name: admin
              containerPort: {{ .Values.admin.listener.port }}
              protocol: TCP
            {{- end }}
            {{- $st := .Values.api.sensorTransport }}
            {{- $v3 := include "openctem.sensorTransportOn" . }}
            {{- if $v3 }}
            - name: sensor-mtls
              containerPort: {{ $st.mtls.port }}
              protocol: TCP
            {{- end }}
          env:
            # Sensor protocol v3 (OpenCTEM RFC-059): HTTPS binding always, gRPC
            # binding advertised only while the API's self-probe passes.
            - name: SENSOR_TRANSPORT_V3
              value: {{ ternary "auto" "off" (eq $v3 "true") | quote }}
            {{- if $v3 }}
            {{- with $st.publicHost }}
            - name: SENSOR_PUBLIC_HOST
              value: {{ . | quote }}
            {{- end }}
            - name: SENSOR_MTLS_LISTEN_ADDR
              value: ":{{ $st.mtls.port }}"
            - name: SENSOR_MTLS_CA_CERT_FILE
              value: /etc/openctem/sensor-ca/tls.crt
            - name: SENSOR_MTLS_CA_KEY_FILE
              value: /etc/openctem/sensor-ca/tls.key
            - name: SENSOR_MTLS_CERT_TTL
              value: {{ $st.mtls.certTTL | quote }}
            {{- /* PROXY headers come from the bundled gateway's pods when it
                 routes sensors: by default the CIDRs already trusted for
                 forwarded headers. Otherwise none unless listed. */}}
            {{- $tp := $st.mtls.trustedProxies }}
            {{- if and (not $tp) (ne (include "openctem.sensorGateway" .) "off") }}
            {{- $tp = .Values.gateway.trustedProxies }}
            {{- end }}
            {{- with $tp }}
            - name: SENSOR_MTLS_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            {{- include "openctem.consoleValidate" . }}
            # Which planes this API process serves (all: tenant API and console
            # API). Splitting needs two deployments; see api.plane.
            - name: OPENCTEM_PLANE
              value: {{ .Values.api.plane | default "all" | quote }}
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "8080"
            {{- if .Values.admin.listener.enabled }}
            # The console API on its own listener; the main port answers 404
            # for /api/v1/admin. The pod IP is a private address, which the
            # API requires for this plain-HTTP listener.
            {{- if .Values.admin.listener.bindPodIP }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ADMIN_LISTEN_ADDR
              value: "$(POD_IP):{{ .Values.admin.listener.port }}"
            {{- else }}
            - name: ADMIN_LISTEN_ADDR
              value: ":{{ .Values.admin.listener.port }}"
            - name: ADMIN_LISTEN_ALLOW_ALL_INTERFACES
              value: "true"
            {{- end }}
            {{- end }}
            - name: ADMIN_ALLOWED_CIDRS
              value: {{ include "openctem.adminAllowedCidrs" . | quote }}
            - name: APP_NAME
              value: {{ include "openctem.name" . }}
            # -- APP_ENV=production (the default) turns validateProduction() into
            # a hard boot gate: DB TLS, Redis TLS + >=32-char password, >=64-char
            # JWT secret, encryption key, and secure cookies all become required.
            - name: APP_ENV
              value: {{ .Values.api.appEnv | quote }}
            - name: AUTH_PROVIDER
              value: {{ .Values.api.auth.provider | quote }}
            - name: AUTH_COOKIE_SECURE
              value: {{ .Values.api.auth.cookieSecure | quote }}
            - name: APP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "openctem.apiEncryptionSecretName" . }}
                  key: {{ include "openctem.apiEncryptionSecretKey" . }}
            {{- with include "openctem.apiFingerprintKeyEnv" . }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "openctem.apiJwtSecretName" . }}
                  key: {{ include "openctem.apiJwtSecretKey" . }}
            - name: DB_HOST
              value: {{ include "openctem.databaseHost" . | quote }}
            - name: DB_PORT
              value: {{ include "openctem.databasePort" . | quote }}
            - name: DB_NAME
              value: {{ include "openctem.databaseName" . | quote }}
            # -- Keep API and the migration Job on the SAME TLS mode (BL-4).
            - name: DB_SSLMODE
              value: {{ include "openctem.databaseSslMode" . | quote }}
            {{- if .Values.postgresql.enabled }}
            - name: DB_USER
              value: {{ include "openctem.databaseUser" . | quote }}
            {{- else }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "openctem.dbCredentialsSecretName" . }}
                  key: {{ .Values.database.auth.userKey }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openctem.dbCredentialsSecretName" . }}
                  key: {{ include "openctem.dbPasswordSecretKey" . }}
            - name: REDIS_HOST
              value: {{ include "openctem.redisEffectiveHost" . | quote }}
            - name: REDIS_PORT
              value: {{ include "openctem.redisEffectivePort" . | quote }}
            - name: REDIS_DB
              value: {{ include "openctem.redisEffectiveDb" . | quote }}
            # -- Redis TLS. Production (APP_ENV=production) REQUIRES TLS. The
            # bundled Bitnami Redis does not terminate TLS, so production
            # deployments should point at an external Redis with TLS enabled.
            - name: REDIS_TLS_ENABLED
              value: {{ .Values.api.redis.tlsEnabled | quote }}
            - name: REDIS_TLS_SKIP_VERIFY
              value: {{ .Values.api.redis.tlsSkipVerify | quote }}
            {{- if $redisCa }}
            - name: REDIS_TLS_CA_FILE
              value: /etc/openctem/redis-ca/ca.crt
            {{- end }}
            {{- with include "openctem.dbCaEnv" . }}
{{- . | trim | nindent 12 }}
{{- end }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openctem.redisPasswordSecretName" . }}
                  key: {{ include "openctem.redisPasswordSecretKey" . }}
            {{- with include "openctem.dbConsoleEnv" . }}
            # The console's identity tables through their own role (database.console)
            {{- . | nindent 12 }}
            {{- end }}
            {{- include "openctem.apiSignupModeEnv" . | nindent 12 }}
            {{- with include "openctem.apiTuningEnv" . }}
            # Sizing (api.goMemLimit, database.maxOpenConns)
            {{- . | nindent 12 }}
            {{- end }}
            {{- with include "openctem.gatewayApiEnv" . }}
            # Gateway (gateway.*): trusted proxy hops and the public origin
            {{- . | nindent 12 }}
            {{- end }}
            # Attachment storage (api.attachments)
            {{- include "openctem.apiAttachmentsEnv" . | nindent 12 }}
            {{- if .Values.monitoring.enabled }}
            # Operator metrics (monitoring.*): /metrics needs this bearer token
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "openctem.metricsSecretName" . }}
                  key: {{ .Values.monitoring.metricsTokenKey }}
            {{- end }}
            # Extra environment variables
            {{- if .Values.api.extraEnv }}
            {{- include "openctem.apiExtraEnv" . | nindent 12 }}
            {{- end }}
            # Extra environment variables from config maps and secrets
          {{- if .Values.api.extraEnvFrom }}
          envFrom:
            {{- toYaml .Values.api.extraEnvFrom | nindent 12 }}
          {{- end }}
          {{- with .Values.api.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $mounts := include "openctem.apiAttachmentsVolumeMount" . }}
          volumeMounts:
            # The root filesystem is read-only; the API writes temporary files
            # (feed chunks, uploads in flight) here.
            - name: tmp
              mountPath: /tmp
            {{- with $mounts }}
            {{- . | trim | nindent 12 }}
            {{- end }}
            {{- with include "openctem.dbCaVolumeMount" . }}
{{- . | trim | nindent 12 }}
{{- end }}
            {{- if $redisCa }}
            - name: redis-ca
              mountPath: /etc/openctem/redis-ca
              readOnly: true
            {{- end }}
            {{- if $v3 }}
            - name: sensor-ca
              mountPath: /etc/openctem/sensor-ca
              readOnly: true
            {{- end }}
            {{- with .Values.api.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- $vols := include "openctem.apiAttachmentsVolume" . }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with $vols }}
        {{- . | trim | nindent 8 }}
        {{- end }}
        {{- with include "openctem.dbCaVolume" . }}
{{- . | trim | nindent 8 }}
{{- end }}
        {{- if $redisCa }}
        - name: redis-ca
          secret:
            secretName: {{ .Values.api.redis.ca.existingSecret }}
            defaultMode: 0444
            items:
              - key: {{ .Values.api.redis.ca.key | default "ca.crt" }}
                path: ca.crt
        {{- end }}
        {{- if $v3 }}
        - name: sensor-ca
          secret:
            secretName: {{ include "openctem.sensorCASecret" . }}
            defaultMode: 0400
        {{- end }}
        {{- with .Values.api.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

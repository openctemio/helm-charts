{{/*
The API metrics token (monitoring.enabled, no monitoring.existingSecret):
random, generated once and kept across upgrades (looked up on the cluster).
The API answers 404 on /metrics without it; the ServiceMonitor sends it.
*/}}
{{- if and .Values.monitoring.enabled (not .Values.monitoring.existingSecret) }}
{{- $name := include "openctem.metricsSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := .Values.monitoring.metricsTokenKey -}}
{{- $token := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data $key) -}}
{{- $token = index $existing.data $key | b64dec -}}
{{- else -}}
{{- $token = randAlphaNum 48 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "openctem.apiLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $key }}: {{ $token | quote }}
{{- end }}

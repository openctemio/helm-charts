{{- if .Values.api.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openctem.apiMigrationsFullname" . }}
  labels:
    {{- include "openctem.apiMigrationsLabels" . | nindent 4 }}
  {{- if .Values.api.migrations.hooks.enabled }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  {{- end }}
spec:
  backoffLimit: {{ .Values.api.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.api.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "openctem.apiMigrationsLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      serviceAccountName: {{ include "openctem.apiServiceAccountName" . }}
      {{- with .Values.api.migrations.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.migrations.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.migrations.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.migrations.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrations
          image: {{ include "openctem.apiMigrationsImage" . | quote }}
          imagePullPolicy: {{ .Values.api.migrations.image.pullPolicy }}
          {{- with .Values.api.migrations.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: DB_HOST
              value: {{ include "openctem.databaseHost" . | quote }}
            - name: DB_PORT
              value: {{ include "openctem.databasePort" . | quote }}
            - name: DB_NAME
              value: {{ include "openctem.databaseName" . | quote }}
            {{- if .Values.postgresql.enabled }}
            - name: DB_USER
              value: {{ include "openctem.databaseUser" . | quote }}
            {{- else }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "openctem.dbCredentialsSecretName" . }}
                  key: {{ .Values.database.auth.userKey }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openctem.dbCredentialsSecretName" . }}
                  key: {{ include "openctem.dbPasswordSecretKey" . }}
            - name: DB_SSLMODE
              value: {{ include "openctem.databaseSslMode" . | quote }}
            {{- with .Values.api.migrations.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          args:
            - "-path=/migrations"
            - "-database=postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=$(DB_SSLMODE)"
            {{- with .Values.api.migrations.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - "up"
          {{- with .Values.api.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "openctem.apiFullname" . }}
  labels:
    {{- include "openctem.apiLabels" . | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort | int }}
      {{- end }}
    {{- $st := .Values.api.sensorTransport }}
    {{- if and $st.enabled $st.publicHost }}
    # Sensor protocol v3 gRPC binding (mutual TLS, never terminated in
    # front of the API).
    - port: {{ $st.mtls.port }}
      targetPort: sensor-mtls
      protocol: TCP
      name: sensor-mtls
    {{- end }}
  selector:
    {{- include "openctem.apiSelectorLabels" . | nindent 4 }}

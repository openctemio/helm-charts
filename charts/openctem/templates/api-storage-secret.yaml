{{- $s3 := .Values.api.attachments.s3 -}}
{{- if and (eq .Values.api.attachments.storage "s3") (not $s3.existingSecret) }}
# S3 credentials for attachment storage, from api.attachments.s3.accessKey /
# secretKey. Prefer api.attachments.s3.existingSecret in production.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openctem.apiAttachmentsStorageSecretName" . }}
  labels:
    {{- include "openctem.apiLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $s3.accessKeyKey }}: {{ $s3.accessKey | quote }}
  {{ $s3.secretKeyKey }}: {{ $s3.secretKey | quote }}
{{- end }}

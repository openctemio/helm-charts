{{- if and .Values.console.enabled .Values.console.ingress.enabled (ne (include "openctem.gatewayMode" .) "caddy") }}
{{- include "openctem.consoleValidate" . -}}
{{- $c := .Values.console -}}
{{- $host := required "admin.site.host is required for console.ingress.enabled" .Values.admin.site.host -}}
{{- if eq (include "openctem.gatewayMode" .) "httpRoute" }}
# The console's own host (admin.site.mode=host), straight to the console
# Service. The Gateway's own policy is the first client-network gate (this
# chart cannot render one for a Gateway: console.ingress.allowedSourceRanges
# only has to be set, as the operator's statement of what that policy allows).
# The console passes the client address the Gateway saw on to the API, which
# checks admin.allowedCidrs against it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "openctem.consoleFullname" . }}
  labels:
    {{- include "openctem.consoleLabels" . | nindent 4 }}
  {{- with $c.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml (required "console.ingress.parentRefs is required for gateway.mode=httpRoute" $c.ingress.parentRefs) | nindent 4 }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "openctem.consoleFullname" . }}
          port: {{ $c.service.port }}
{{- else }}
# The console's own host (admin.site.mode=host), straight to the console
# Service. The first client-network gate is the ingress controller's source
# range allow-list, rendered from the required console.ingress.allowedSourceRanges
# (annotation key: console.ingress.sourceRangeAnnotation; it wins over
# console.ingress.annotations). The console also passes the client address the
# controller saw on to the API, which checks admin.allowedCidrs against it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openctem.consoleFullname" . }}
  labels:
    {{- include "openctem.consoleLabels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict $c.ingress.sourceRangeAnnotation (join "," $c.ingress.allowedSourceRanges)) ($c.ingress.annotations | default dict)) | nindent 4 }}
spec:
  {{- with $c.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $c.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $c.ingress.tls.secretName | default (printf "%s-tls" (include "openctem.consoleFullname" .)) }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "openctem.consoleFullname" . }}
                port:
                  number: {{ $c.service.port }}
{{- end }}
{{- end }}

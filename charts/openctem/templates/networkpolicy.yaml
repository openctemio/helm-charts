{{- if .Values.networkPolicy.enabled }}
{{- $gwMode := include "openctem.gatewayMode" . }}
{{/*
Opt-in NetworkPolicy set. Baseline is default-DENY ingress for every pod of
this release (the bundled datastores included); the policies below re-open
only the real OpenCTEM flows:
  ingress-controller -> ui:3000, (ui|console|helm-test) -> api:8080,
  console pods -> api console listener, gateway (caddy) or console ingress
  -> console:3000,
  gateway.mode=caddy: anywhere -> gateway:443/80, gateway -> ui:3000/api:8080,
  gateway.mode=ingress|httpRoute: ingress-controller -> api:8080,
  api/migrations -> postgres:5432, api/migrations -> redis:6379,
  api egress (DNS + HTTPS threat-intel / CT feeds).
The default-deny selects this release's pods only (app.kubernetes.io/instance),
so other workloads in a shared namespace keep their own policies; a dedicated
namespace is still recommended.
*/}}
---
# Default-deny all ingress to this release's pods (egress is left open unless
# the API egress policy below narrows it).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openctem.fullname" . }}-default-deny-ingress
  labels:
    {{- include "openctem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
---
# Allow inbound to the UI from the ingress controller (and, when no controller
# selector is configured, from any source — podSelector still limits the target).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openctem.uiFullname" . }}-allow-ingress
  labels:
    {{- include "openctem.uiLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openctem.uiSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if or (ne $gwMode "caddy") .Values.ui.ingress.enabled .Values.ui.httpRoute.enabled }}
    - from:
        {{- if or .Values.networkPolicy.ingressControllerNamespaceSelector .Values.networkPolicy.ingressControllerPodSelector }}
        - {{- if .Values.networkPolicy.ingressControllerNamespaceSelector }}
          namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 14 }}
          {{- end }}
          {{- if .Values.networkPolicy.ingressControllerPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerPodSelector | nindent 14 }}
          {{- end }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - port: 3000
          protocol: TCP
    {{- end }}
    {{- if eq $gwMode "caddy" }}
    # The bundled gateway (the only source when the UI has no ingress of its
    # own: the UI trusts the client-IP headers its caller sends).
    - from:
        - podSelector:
            matchLabels:
              {{- include "openctem.gatewaySelectorLabels" . | nindent 14 }}
      ports:
        - port: 3000
          protocol: TCP
    {{- end }}
    {{- if .Values.tests.enabled }}
    # The `helm test` Pod (it exists only while the test runs).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: test
      ports:
        - port: 3000
          protocol: TCP
    {{- end }}
{{- if .Values.console.enabled }}
---
# Allow inbound to the console only from the bundled gateway (caddy) or, with
# console.ingress, the ingress controller. Never from other pods: the console
# trusts the client-address headers its caller sends.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openctem.consoleFullname" . }}-allow-ingress
  labels:
    {{- include "openctem.consoleLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openctem.consoleSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if eq $gwMode "caddy" }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "openctem.gatewaySelectorLabels" . | nindent 14 }}
      ports:
        - port: 3000
          protocol: TCP
    {{- end }}
    {{- if .Values.console.ingress.enabled }}
    - from:
        {{- if or .Values.networkPolicy.ingressControllerNamespaceSelector .Values.networkPolicy.ingressControllerPodSelector }}
        - {{- if .Values.networkPolicy.ingressControllerNamespaceSelector }}
          namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 14 }}
          {{- end }}
          {{- if .Values.networkPolicy.ingressControllerPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerPodSelector | nindent 14 }}
          {{- end }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - port: 3000
          protocol: TCP
    {{- end }}
{{- end }}
---
# Allow inbound to the API from any pod in this release (UI, console + the
# helm-test pod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openctem.apiFullname" . }}-allow-ingress
  labels:
    {{- include "openctem.apiLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openctem.apiSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 8080
          protocol: TCP
    {{- if .Values.admin.listener.enabled }}
    # The console listener: the console pods only.
    - from:
        - podSelector:
            matchLabels:
              {{- include "openctem.consoleSelectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.admin.listener.port }}
          protocol: TCP
    {{- end }}
    {{- $st := .Values.api.sensorTransport }}
    {{- if include "openctem.sensorTransportOn" . }}
    # Sensor protocol v3 gRPC binding (mutual TLS): from the release's pods
    # (the bundled gateway's layer-4 routing, the API's own self-probe), the
    # ingress controller (an ssl-passthrough Ingress for publicHost), or from
    # anywhere through the dedicated Service. The client certificate is the
    # access control.
    - from:
        {{- if $st.dedicatedService.enabled }}
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
        {{- else }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- if and $st.publicHost (has $gwMode (list "ingress" "httpRoute")) }}
        {{- if or .Values.networkPolicy.ingressControllerNamespaceSelector .Values.networkPolicy.ingressControllerPodSelector }}
        - {{- if .Values.networkPolicy.ingressControllerNamespaceSelector }}
          namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 14 }}
          {{- end }}
          {{- if .Values.networkPolicy.ingressControllerPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerPodSelector | nindent 14 }}
          {{- end }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
        {{- end }}
        {{- end }}
      ports:
        - port: {{ $st.mtls.port }}
          protocol: TCP
    {{- end }}
    {{- if and .Values.monitoring.enabled .Values.monitoring.serviceMonitor.enabled }}
    # Prometheus scrapes /metrics (monitoring.serviceMonitor).
    - from:
        {{- if or .Values.monitoring.prometheusNamespaceSelector .Values.monitoring.prometheusPodSelector }}
        - {{- if .Values.monitoring.prometheusNamespaceSelector }}
          namespaceSelector:
            matchLabels:
              {{- toYaml .Values.monitoring.prometheusNamespaceSelector | nindent 14 }}
          {{- end }}
          {{- if .Values.monitoring.prometheusPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.monitoring.prometheusPodSelector | nindent 14 }}
          {{- end }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
    {{- if has $gwMode (list "ingress" "httpRoute") }}
    # gateway.mode={{ $gwMode }}: the ingress controller / Gateway routes the
    # dedicated API paths straight to the API.
    - from:
        {{- if or .Values.networkPolicy.ingressControllerNamespaceSelector .Values.networkPolicy.ingressControllerPodSelector }}
        - {{- if .Values.networkPolicy.ingressControllerNamespaceSelector }}
          namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 14 }}
          {{- end }}
          {{- if .Values.networkPolicy.ingressControllerPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerPodSelector | nindent 14 }}
          {{- end }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
{{- if eq $gwMode "caddy" }}
---
# The bundled gateway is the public entry point: its HTTPS (and, in tls.mode
# http/acme, HTTP) port is open to any source. Nothing else on it is exposed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openctem.gatewayFullname" . }}-allow-ingress
  labels:
    {{- include "openctem.gatewayLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openctem.gatewaySelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        {{- $tlsMode := include "openctem.gatewayCaddyTlsMode" . }}
        {{- if ne $tlsMode "http" }}
        - port: 443
          protocol: TCP
        {{- end }}
        {{- if has $tlsMode (list "http" "acme") }}
        - port: 80
          protocol: TCP
        {{- end }}
        {{- if include "openctem.adminSitePort" . }}
        # The console's own port (admin.site.mode=port): reachable from any
        # source here; admin.allowedCidrs gates it at the gateway.
        - port: {{ .Values.admin.site.port }}
          protocol: TCP
        {{- end }}
{{- end }}
{{- if .Values.postgresql.enabled }}
---
# Allow the API + migration jobs to reach the bundled PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openctem.fullname" . }}-allow-postgres
  labels:
    {{- include "openctem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
{{- if .Values.redis.enabled }}
---
# Allow the API + migration jobs to reach the bundled Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openctem.fullname" . }}-allow-redis
  labels:
    {{- include "openctem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 6379
          protocol: TCP
{{- end }}
---
# API egress. threat-intel / CVE / Certificate-Transparency feeds are reached
# over HTTPS, so egress defaults to permissive (allowAll). Set
# networkPolicy.api.egress.allowAll=false to restrict to DNS + datastores +
# networkPolicy.api.egress.extra (pin threat-intel CIDRs there).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openctem.apiFullname" . }}-egress
  labels:
    {{- include "openctem.apiLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openctem.apiSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- if .Values.networkPolicy.api.egress.allowAll }}
    - {}
    {{- else }}
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
    {{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 6379
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.api.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
{{- end }}

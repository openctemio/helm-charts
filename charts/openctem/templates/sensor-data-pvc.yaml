{{- $sensor := include "openctem.sensor" . | fromYaml -}}
{{- $persist := ((($sensor.data | default dict).persistence) | default dict) -}}
{{- if and $sensor.enabled (eq $sensor._layout "data") $persist.enabled (not $persist.existingClaim) }}
# The sensor's data at /var/lib/openctem: state/ (its paired identity or
# the API key it renews on its own), outbox/ (results the platform has not
# accepted yet) and content/ (the scanner cache). Holds a credential. Kept
# when the release is uninstalled (sensor.persistence.keepOnUninstall,
# default true): delete it by hand.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openctem.sensorFullname" . }}-data
  labels:
    {{- include "openctem.sensorLabels" . | nindent 4 }}
  {{- if (($sensor.persistence | default dict).keepOnUninstall) }}
  annotations:
    # Keeps the sensor's identity across helm uninstall (sensor.persistence.keepOnUninstall).
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml $persist.accessModes | nindent 4 }}
  {{- with $persist.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $persist.size | quote }}
{{- end }}

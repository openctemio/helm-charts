{{- $sensor := include "openctem.sensor" . | fromYaml -}}
{{- if $sensor.enabled }}
{{- $outbox := $sensor.outbox | default dict -}}
{{- $persist := ($outbox.persistence | default dict) -}}
{{- $content := $sensor.content | default dict -}}
{{- $contentPersist := ($content.persistence | default dict) -}}
{{- $statePersist := (($sensor.state | default dict).persistence | default dict) -}}
{{- $data := $sensor.data | default dict -}}
{{- $dataPersist := ($data.persistence | default dict) -}}
{{- /* One data volume at /var/lib/openctem, or a volume per directory
       (sensor.storageLayout; resolved in openctem.sensor). */ -}}
{{- $split := eq $sensor._layout "split" -}}
{{- $anyPVC := ternary (or $persist.enabled $statePersist.enabled $contentPersist.enabled) $dataPersist.enabled $split -}}
{{- $lp := $sensor.localPolicy | default dict -}}
{{- /* No API key: the sensor pairs and keeps its identity in the state volume. */ -}}
{{- $pairing := not (or $sensor.apiKey $sensor.existingSecret) -}}
{{- $instance := eq ($sensor.enrollment | default "pairing") "instance" -}}
{{- $orgToken := eq ($sensor.enrollment | default "pairing") "token" -}}
{{- $et := $sensor.enrollmentToken | default dict -}}
{{- $js := $sensor.jobSigning | default dict -}}
{{- $pinValues := or $js.root $js.keys -}}
{{- $pinSigner := include "openctem.signerPublishForSensor" . -}}
{{- if not (has ($sensor.enrollment | default "pairing") (list "pairing" "instance" "token")) }}
{{- fail "\n\nsensor.enrollment must be pairing, instance or token.\n" }}
{{- end }}
{{- $apiUrl := $sensor.apiUrl | default (printf "http://%s:%v" (include "openctem.apiFullname" .) .Values.api.service.port) -}}
{{- if and (hasPrefix "http://" (lower $apiUrl)) (not (regexMatch "^http://(localhost|127\\.[0-9.]+|\\[::1\\])([:/]|$)" (lower $apiUrl))) (not $sensor.allowInsecureHTTP) }}
{{- fail (printf "\n\nThe sensor would use %s, which is plain http to a host that is not loopback. The sensor refuses that (SENSOR_ALLOW_INSECURE_HTTP). Set sensor.apiUrl to an https URL of the API (preferred), or set sensor.allowInsecureHTTP=true for development and evaluation only.\n" $apiUrl) }}
{{- end }}
{{- if and $sensor.pairingCode $sensor.pairingCodeExistingSecret }}
{{- fail "\n\nSet only one of sensor.pairingCode and sensor.pairingCodeExistingSecret.\n" }}
{{- end }}
{{- if and (or $sensor.pairingCode $sensor.pairingCodeExistingSecret) (or $instance $orgToken (not $pairing)) }}
{{- fail "\n\nsensor.pairingCode applies only to sensor.enrollment=pairing without an API key.\n" }}
{{- end }}
{{- if and $instance (not $pairing) }}
{{- fail "\n\nsensor.enrollment=instance enrolls the sensor with its own key as a shared sensor: leave sensor.apiKey and sensor.existingSecret empty.\n" }}
{{- end }}
{{- if and $orgToken (not $pairing) }}
{{- fail "\n\nsensor.enrollment=token enrolls the sensor with its own key: leave sensor.apiKey and sensor.existingSecret empty.\n" }}
{{- end }}
{{- if and $orgToken (not $et.existingSecret) }}
{{- fail "\n\nsensor.enrollment=token needs sensor.enrollmentToken.existingSecret: a Secret holding the token from Sensors > Enrollment tokens.\n" }}
{{- end }}
{{- if and $pairing $split (not $statePersist.enabled) }}
{{- fail "\n\nThe sensor pairs (no sensor.apiKey or sensor.existingSecret), so its identity must survive the pod: set sensor.state.persistence.enabled=true (the default), or give it an API key.\n" }}
{{- end }}
{{- if and $pairing (not $split) (not $dataPersist.enabled) }}
{{- fail "\n\nThe sensor pairs (no sensor.apiKey or sensor.existingSecret), so its identity must survive the pod: set sensor.data.persistence.enabled=true (the default), or give it an API key.\n" }}
{{- end }}
{{- if and (not $split) $dataPersist.enabled (gt (int $sensor.replicaCount) 1) }}
{{- fail "\n\nsensor.data.persistence needs sensor.replicaCount=1: the data volume is a ReadWriteOnce volume of one sensor process, and it holds one sensor's identity (replicas sharing a key are flagged as a cloned identity). Run one release per sensor, or set sensor.data.persistence.enabled=false for a multi-replica Deployment with an API key (then key auto-renewal stays off).\n" }}
{{- end }}
{{- $sandbox := $sensor.sandbox | default dict -}}
{{- if not (has ($sandbox.network | default "auto") (list "auto" "required" "off")) }}
{{- fail "\n\nsensor.sandbox.network must be auto, required or off.\n" }}
{{- end }}
{{- if not (has ($sandbox.seccompProfile | default "runtime-default") (list "runtime-default" "openctem")) }}
{{- fail "\n\nsensor.sandbox.seccompProfile must be runtime-default or openctem.\n" }}
{{- end }}
{{- $ownSeccomp := eq $sandbox.seccompProfile "openctem" -}}
{{- $userSeccomp := ((($sensor.podSecurityContext | default dict).seccompProfile | default dict).type | default "RuntimeDefault") -}}
{{- if and (eq $sandbox.network "required") (not $ownSeccomp) (eq $userSeccomp "RuntimeDefault") }}
{{- fail "\n\nsensor.sandbox.network=required cannot work under the runtime's default seccomp profile, which blocks the namespaces confinement needs: set sensor.sandbox.seccompProfile=openctem (or your own Localhost profile in sensor.podSecurityContext.seccompProfile).\n" }}
{{- end }}
{{- if and (eq $userSeccomp "Unconfined") }}
{{- fail "\n\nsensor.podSecurityContext.seccompProfile Unconfined is refused: use sensor.sandbox.seccompProfile=openctem for confinement.\n" }}
{{- end }}
{{- /* A shared sensor of the instance runs jobs of many organizations on one
       host: since sdk-go v0.35.0 an identity enrolled at instance scope
       refuses to start without shared mode (SENSOR_SHARED_MODE=1), and shared
       mode refuses to start without the tool sandbox, network confinement
       and a local policy. Refuse the render here, before the single-use
       enrollment token is spent by a pod that can only crash-loop. */ -}}
{{- if $instance }}
{{- if ne ($sandbox.network | default "auto") "required" }}
{{- fail "\n\nsensor.enrollment=instance runs a shared sensor (SENSOR_SHARED_MODE=1), which refuses to start unless every tool runs sandboxed and network-confined: set sensor.sandbox.network=required.\n" }}
{{- end }}
{{- if and (not $ownSeccomp) (ne $userSeccomp "Localhost") }}
{{- fail "\n\nsensor.enrollment=instance needs the sensor's seccomp profile, which allows the namespaces per-task confinement uses: set sensor.sandbox.seccompProfile=openctem (or your own Localhost profile in sensor.podSecurityContext.seccompProfile).\n" }}
{{- end }}
{{- if not $lp.enabled }}
{{- fail "\n\nsensor.enrollment=instance runs a shared sensor, which refuses to start without a local policy (the host owner's limits on what jobs of any organization may scan): set sensor.localPolicy.enabled=true with sensor.localPolicy.policy or sensor.localPolicy.existingConfigMap (README: \"Bundled shared sensor\").\n" }}
{{- end }}
{{- end }}
{{- if and $split $persist.enabled (gt (int $sensor.replicaCount) 1) }}
{{- fail "\n\nsensor.outbox.persistence.enabled needs sensor.replicaCount=1: an outbox belongs to one sensor process (the sensor locks it).\n" }}
{{- end }}
{{- if and $split (or $statePersist.enabled $contentPersist.enabled) (gt (int $sensor.replicaCount) 1) }}
{{- fail "\n\nsensor.state.persistence and sensor.content.persistence need sensor.replicaCount=1: each is a ReadWriteOnce volume of one sensor process, and the state holds one sensor's API key (replicas sharing a key are flagged as a cloned identity). Run one release per sensor, or turn both off for a multi-replica Deployment (then key auto-renewal stays off).\n" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openctem.sensorFullname" . }}
  labels:
    {{- include "openctem.sensorLabels" . | nindent 4 }}
spec:
  # A sensor is one identity (one key): run a single replica. Replicas
  # sharing a key are flagged by the platform as a cloned identity.
  replicas: {{ $sensor.replicaCount }}
  {{- if $anyPVC }}
  # The sensor's volumes are ReadWriteOnce and belong to one sensor process:
  # the old pod must stop before the new one starts.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "openctem.sensorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or (and $sensor.apiKey (not $sensor.existingSecret)) (and $lp.enabled (not $lp.existingConfigMap)) $sensor.podAnnotations $pinValues }}
      annotations:
        {{- if and $sensor.apiKey (not $sensor.existingSecret) }}
        checksum/credentials-secret: {{ include (print $.Template.BasePath "/sensor-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if and $lp.enabled (not $lp.existingConfigMap) }}
        # The sensor reads its policy once at start: a changed policy rolls the pod.
        checksum/local-policy: {{ include (print $.Template.BasePath "/sensor-policy-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if $pinValues }}
        # The sensor reads its pin once at start: a changed pin rolls the pod.
        checksum/job-signing: {{ toJson (pick $js "root" "keys") | sha256sum }}
        {{- end }}
        {{- with $sensor.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "openctem.sensorLabels" . | nindent 8 }}
        {{- with $sensor.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ $sensor.terminationGracePeriodSeconds | default 45 }}
      # The sensor runs scanners against untrusted targets and never calls the
      # Kubernetes API: no service account token in the pod.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $podSC := deepCopy ($sensor.podSecurityContext | default dict) }}
      {{- if and $anyPVC $persist.fsGroup (not (hasKey $podSC "fsGroup")) }}
      {{- $_ := set $podSC "fsGroup" (int $persist.fsGroup) }}
      {{- end }}
      {{- /* fsGroup with the default policy (Always) makes the identity key
             group-readable at every mount, and the sensor then refuses it. */}}
      {{- if and (hasKey $podSC "fsGroup") (not (hasKey $podSC "fsGroupChangePolicy")) }}
      {{- $_ := set $podSC "fsGroupChangePolicy" "OnRootMismatch" }}
      {{- end }}
      {{- if $ownSeccomp }}
      {{- /* The sensor's own profile (installed on the node): the runtime's
             default plus clone/unshare of new namespaces. */}}
      {{- $_ := set $podSC "seccompProfile" (dict "type" "Localhost" "localhostProfile" (include "openctem.sensorSeccompFile" .)) }}
      {{- end }}
      {{- with $podSC }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sensor
          {{- $sc := deepCopy ($sensor.securityContext | default dict) }}
          {{- if $sensor.netRaw }}
          {{- $caps := deepCopy ($sc.capabilities | default dict) }}
          {{- $_ := set $caps "add" (append ($caps.add | default list) "NET_RAW" | uniq) }}
          {{- $_ := set $sc "capabilities" $caps }}
          {{- end }}
          {{- with $sc }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The sensor is versioned separately from the platform, so the tag
          # does not default to the chart appVersion (see values.yaml).
          image: {{ include "openctem.image" (dict "image" $sensor.image "root" . "requireTag" "sensor.image.tag is required (the sensor does not follow the chart appVersion; e.g. v0.9.1)") | quote }}
          imagePullPolicy: {{ $sensor.image.pullPolicy }}
          # The image entrypoint is /usr/local/bin/openctemio-sensor.
          args:
            # Sensor v0.21+ runs as the daemon and takes platform commands by
            # default, and detects the scanners installed in the image.
            {{- with $sensor.tools }}
            - "-tools={{ . }}"
            {{- end }}
            # A renewed API key lives in the state volume (unused when the
            # sensor pairs).
            - "-credentials=/var/lib/openctem/state/sensor-credentials.json"
            {{- if $sensor.verbose }}
            - "-verbose"
            {{- end }}
          env:
            # Co-located: talk to the in-cluster API service.
            - name: SENSOR_API_URL
              value: {{ $apiUrl | quote }}
            {{- if $sensor.allowInsecureHTTP }}
            - name: SENSOR_ALLOW_INSECURE_HTTP
              value: "1"
            {{- end }}
            - name: SENSOR_REGION
              value: {{ $sensor.region | quote }}
            {{- if $pairing }}
            # No SENSOR_API_KEY: the sensor pairs. It makes its own key in the state
            # volume and logs a code for an administrator to approve under
            # Sensors > Add sensor; then it signs every request.
            - name: SENSOR_NAME
              value: {{ $sensor.name | default (include "openctem.sensorFullname" .) | quote }}
            {{- if $sensor.pairingCodeExistingSecret }}
            # A single-use pairing code from the console (10 minutes). The sensor
            # uses it once, never reuses a spent code and ignores it once paired.
            - name: SENSOR_PAIRING_CODE
              valueFrom:
                secretKeyRef:
                  name: {{ $sensor.pairingCodeExistingSecret | quote }}
                  key: {{ $sensor.pairingCodeExistingSecretKey | default "pairing-code" | quote }}
            {{- else if $sensor.pairingCode }}
            - name: SENSOR_PAIRING_CODE
              value: {{ $sensor.pairingCode | quote }}
            {{- end }}
            {{- if $instance }}
            # sensor.enrollment=instance: a single-use token the
            # sensor-enrollment Job registered, read from the mounted Secret
            # (never the environment); the sensor enrolls as a shared sensor
            # on first start and ignores it once it has an identity.
            - name: SENSOR_INSTANCE_ENROLLMENT_TOKEN_FILE
              value: /var/run/secrets/openctem/instance-enrollment/token
            # Shared mode: every job sandboxed and network-confined in its own
            # task directory, the local policy required, only signed jobs.
            # An identity enrolled at instance scope does not start without it.
            - name: SENSOR_SHARED_MODE
              value: "1"
            - name: SENSOR_SANDBOX
              value: required
            {{- end }}
            {{- if $orgToken }}
            # sensor.enrollment=token: an organization enrollment token, read
            # from the mounted Secret (never the environment) on first start
            # and ignored once the sensor has an identity.
            - name: SENSOR_ENROLLMENT_TOKEN_FILE
              value: /var/run/secrets/openctem/enrollment/token
            {{- end }}
            {{- else }}
            {{- with $sensor.name }}
            - name: SENSOR_NAME
              value: {{ . | quote }}
            {{- end }}
            # The credential comes from a Secret, never from args (which are
            # visible via `kubectl describe pod`).
            - name: SENSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "openctem.sensorSecretName" (dict "context" . "sensor" $sensor) }}
                  key: {{ include "openctem.sensorSecretKey" (dict "sensor" $sensor) }}
            {{- end }}
            {{- if $pinValues }}
            # The job-signing pin from sensor.jobSigning (read-only file:
            # exclusive, the keys served at pairing are not trusted next to it).
            {{- if $js.root }}
            - name: SENSOR_JOB_SIGNING_ROOT_FILE
              value: /etc/openctem/job-signing/root
            {{- end }}
            {{- if $js.keys }}
            - name: SENSOR_JOB_SIGNING_KEYS_FILE
              value: /etc/openctem/job-signing/keys
            {{- end }}
            {{- else if $pinSigner }}
            # The chart signer's own public key, which the signer published
            # (read-only file: exclusive, see sensor.jobSigning.fromSigner).
            - name: SENSOR_JOB_SIGNING_KEYS_FILE
              value: /etc/openctem/job-signing/signer.pub
            {{- end }}
            {{- with $sensor.caFingerprint }}
            - name: SENSOR_CA_FINGERPRINT
              value: {{ . | quote }}
            {{- end }}
            {{- with $sensor.platformKey }}
            - name: SENSOR_PLATFORM_KEY
              value: {{ . | quote }}
            {{- end }}
            # Always explicit: the sensor's own check counts any volume as
            # persistent, an emptyDir too, which is lost with the pod.
            - name: SENSOR_KEY_AUTORENEW
              value: {{ $sensor.keyAutoRenew | quote }}
            - name: SENSOR_STATE_DIR
              value: /var/lib/openctem/state
            - name: SENSOR_CONTENT_DIR
              value: /var/lib/openctem/content
            {{- if $split }}
            # The local store holds the key that encrypts the outbox: it sits
            # on the state volume (as sensitive as the signing key), apart
            # from the outbox it protects. Scratch workspaces are an emptyDir.
            - name: SENSOR_STORE_DIR
              value: /var/lib/openctem/state/store
            - name: SENSOR_WORKSPACE_DIR
              value: /var/lib/openctem/workspaces
            {{- end }}
            # Per-task network confinement (RFC-060).
            - name: SENSOR_SANDBOX_NETWORK
              value: {{ $sandbox.network | default "auto" | quote }}
            # The home directory stays the image's (read-only): it holds the
            # baked nuclei-templates release. Tools write their configuration
            # and cache under /tmp instead.
            - name: XDG_CONFIG_HOME
              value: /tmp/.config
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            {{- if eq $sensor.allowPrivateTargets "1" }}
            # Explicit opt-in: allow RFC1918 / ULA scan targets. Unset (the
            # default) keeps them blocked: co-located sensors are for
            # external-reachable work; internal scanning belongs on a remote
            # sensor.
            - name: SENSOR_ALLOW_PRIVATE_TARGETS
              value: "1"
            {{- end }}
            {{- with $sensor.scanRoots }}
            - name: SENSOR_SCAN_ROOTS
              value: {{ . | quote }}
            {{- end }}
            # The outbox (results not yet accepted by the platform).
            - name: SENSOR_OUTBOX_DIR
              value: /var/lib/openctem/outbox
            {{- with $outbox.maxBytes }}
            - name: SENSOR_OUTBOX_MAX_BYTES
              value: {{ . | quote }}
            {{- end }}
            {{- with $outbox.maxAge }}
            - name: SENSOR_OUTBOX_MAX_AGE
              value: {{ . | quote }}
            {{- end }}
            {{- if $lp.enabled }}
            # The sensor-local policy (read-only mount below).
            - name: SENSOR_LOCAL_POLICY
              value: /etc/openctem/sensor-policy.yaml
            {{- end }}
            {{- with $lp.killSwitchFile }}
            - name: SENSOR_KILL_SWITCH_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with $sensor.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if $split }}
            - name: outbox
              mountPath: /var/lib/openctem/outbox
            - name: state
              mountPath: /var/lib/openctem/state
            - name: content
              mountPath: /var/lib/openctem/content
            - name: workspaces
              mountPath: /var/lib/openctem/workspaces
            {{- else }}
            # One data volume: state/, outbox/ and content/ (the sensor
            # creates them on a fresh volume).
            - name: data
              mountPath: /var/lib/openctem
            {{- end }}
            # Writable over the read-only root filesystem (sensor.writableDirs).
            {{- range $i, $d := $sensor.writableDirs }}
            - name: writable-{{ $i }}
              mountPath: {{ $d }}
            {{- end }}
            {{- if $lp.enabled }}
            - name: local-policy
              mountPath: /etc/openctem/sensor-policy.yaml
              subPath: sensor-policy.yaml
              readOnly: true
            {{- end }}
            {{- if $orgToken }}
            - name: enrollment-token
              mountPath: /var/run/secrets/openctem/enrollment
              readOnly: true
            {{- end }}
            {{- if or $pinValues $pinSigner }}
            - name: job-signing
              mountPath: /etc/openctem/job-signing
              readOnly: true
            {{- end }}
            {{- if $instance }}
            - name: instance-enrollment-token
              mountPath: /var/run/secrets/openctem/instance-enrollment
              readOnly: true
            {{- end }}
            {{- with $sensor.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $sensor.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if $pinValues }}
        - name: job-signing
          configMap:
            name: {{ include "openctem.sensorFullname" . }}-job-signing
            defaultMode: 0444
        {{- else if $pinSigner }}
        # Filled by the API pod's exporter: until signer.pub is there the
        # volume cannot be set up and the sensor does not start (it never
        # pairs unpinned).
        - name: job-signing
          configMap:
            name: {{ include "openctem.signerPubConfigMap" . }}
            defaultMode: 0444
            items:
              - key: signer.pub
                path: signer.pub
        {{- end }}
        {{- if $instance }}
        # The instance enrollment token: readable by the sensor's group only,
        # never writable (the sensor refuses a group- or world-writable file).
        - name: instance-enrollment-token
          secret:
            secretName: {{ include "openctem.sensorEnrollmentSecretName" (dict "context" . "sensor" $sensor) }}
            defaultMode: 0440
            items:
              - key: {{ include "openctem.sensorEnrollmentSecretKey" (dict "sensor" $sensor) }}
                path: token
        {{- end }}
        {{- if $orgToken }}
        # The organization enrollment token: readable by the sensor's group
        # only, never writable (the sensor refuses a group- or
        # world-writable token file).
        - name: enrollment-token
          secret:
            secretName: {{ $et.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ $et.existingSecretKey | default "token" }}
                path: token
        {{- end }}
        {{- if not $split }}
        - name: data
          {{- if $dataPersist.enabled }}
          persistentVolumeClaim:
            claimName: {{ $dataPersist.existingClaim | default (printf "%s-data" (include "openctem.sensorFullname" .)) }}
          {{- else if $data.emptyDirSizeLimit }}
          # Lost with the pod (API key only: key auto-renewal stays off, and
          # results still queued when the pod is replaced are lost).
          emptyDir:
            sizeLimit: {{ $data.emptyDirSizeLimit }}
          {{- else }}
          # Lost with the pod (API key only: key auto-renewal stays off, and
          # results still queued when the pod is replaced are lost).
          emptyDir: {}
          {{- end }}
        {{- else }}
        - name: outbox
          {{- if $persist.enabled }}
          persistentVolumeClaim:
            claimName: {{ $persist.existingClaim | default (printf "%s-outbox" (include "openctem.sensorFullname" .)) }}
          {{- else if $outbox.emptyDirSizeLimit }}
          # Survives a container restart, not a pod deletion: see
          # sensor.outbox.persistence.
          emptyDir:
            sizeLimit: {{ $outbox.emptyDirSizeLimit }}
          {{- else }}
          # Survives a container restart, not a pod deletion: see
          # sensor.outbox.persistence.
          emptyDir: {}
          {{- end }}
        - name: state
          {{- if $statePersist.enabled }}
          persistentVolumeClaim:
            claimName: {{ $statePersist.existingClaim | default (printf "%s-state" (include "openctem.sensorFullname" .)) }}
          {{- else }}
          # Lost with the pod (API key only: key auto-renewal stays off,
          # sensor.keyAutoRenew).
          emptyDir: {}
          {{- end }}
        - name: content
          {{- if $contentPersist.enabled }}
          persistentVolumeClaim:
            claimName: {{ $contentPersist.existingClaim | default (printf "%s-content" (include "openctem.sensorFullname" .)) }}
          {{- else if $content.emptyDirSizeLimit }}
          # A cache: downloaded again when the pod is replaced.
          emptyDir:
            sizeLimit: {{ $content.emptyDirSizeLimit }}
          {{- else }}
          # A cache: downloaded again when the pod is replaced.
          emptyDir: {}
          {{- end }}
        - name: workspaces
          # Scratch space for running jobs; lost with the pod.
          emptyDir:
            sizeLimit: {{ ($sensor.workspaces | default dict).sizeLimit | default "2Gi" }}
        {{- end }}
        {{- range $i, $d := $sensor.writableDirs }}
        - name: writable-{{ $i }}
          {{- if $sensor.writableDirsSizeLimit }}
          emptyDir:
            sizeLimit: {{ $sensor.writableDirsSizeLimit }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if $lp.enabled }}
        - name: local-policy
          configMap:
            name: {{ $lp.existingConfigMap | default (printf "%s-policy" (include "openctem.sensorFullname" .)) }}
            defaultMode: 0444
            items:
              - key: {{ ternary ($lp.existingConfigMapKey | default "sensor-policy.yaml") "sensor-policy.yaml" (not (empty $lp.existingConfigMap)) }}
                path: sensor-policy.yaml
        {{- end }}
        {{- with $sensor.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $sensor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sensor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sensor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

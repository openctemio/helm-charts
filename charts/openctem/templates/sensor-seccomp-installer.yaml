{{- $sensor := include "openctem.sensor" . | fromYaml -}}
{{- $sandbox := $sensor.sandbox | default dict -}}
{{- if and $sensor.enabled (eq $sandbox.seccompProfile "openctem") $sandbox.installProfile }}
{{- $file := include "openctem.sensorSeccompFile" . -}}
{{- $image := $sandbox.installerImage | default (printf "%s:%s" $sensor.image.repository $sensor.image.tag) -}}
# The sensor's seccomp profile (OpenCTEM RFC-060): the container runtime's
# default profile plus clone/unshare of new namespaces, which per-task
# network confinement needs. Installed on each node the sensor can run on.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openctem.sensorFullname" . }}-seccomp
  labels:
    {{- include "openctem.sensorLabels" . | nindent 4 }}
data:
  openctem-sensor.json: |-
    {{- .Files.Get "files/seccomp/openctem-sensor.json" | nindent 4 }}
---
# Writes the profile to <kubelet root>/seccomp/{{ $file }} and stays idle.
# Root (the directory is root's) with no capabilities, no privilege
# escalation, a read-only root filesystem, and the only host path mounted is
# the kubelet's seccomp/openctem directory.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "openctem.sensorFullname" . }}-seccomp
  labels:
    {{- include "openctem.sensorLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: sensor-seccomp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/profile: {{ .Files.Get "files/seccomp/openctem-sensor.json" | sha256sum }}
      labels:
        app.kubernetes.io/component: sensor-seccomp
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install
          image: {{ $image | quote }}
          imagePullPolicy: {{ $sensor.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - cp /profile/openctem-sensor.json "/host/{{ base $file }}.tmp" && chmod 0644 "/host/{{ base $file }}.tmp" && mv "/host/{{ base $file }}.tmp" "/host/{{ base $file }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: profile
              mountPath: /profile
              readOnly: true
            - name: host-seccomp
              mountPath: /host
          resources:
            limits: {cpu: 50m, memory: 32Mi}
            requests: {cpu: 5m, memory: 8Mi}
      containers:
        - name: idle
          image: {{ $image | quote }}
          imagePullPolicy: {{ $sensor.image.pullPolicy }}
          command: ["/bin/sh", "-c", "trap 'exit 0' TERM; while :; do sleep 3600 & wait $!; done"]
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits: {cpu: 10m, memory: 16Mi}
            requests: {cpu: 1m, memory: 4Mi}
      volumes:
        - name: profile
          configMap:
            name: {{ include "openctem.sensorFullname" . }}-seccomp
        - name: host-seccomp
          hostPath:
            path: {{ printf "%s/seccomp/%s" ($sandbox.kubeletRoot | default "/var/lib/kubelet") (dir $file) | quote }}
            type: DirectoryOrCreate
      {{- with $sensor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sensor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sensor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

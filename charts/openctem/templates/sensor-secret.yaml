{{- $sensor := include "openctem.sensor" . | fromYaml -}}
{{- /* Only for an API-key sensor: without a key (the default) the sensor pairs. */ -}}
{{- if and $sensor.enabled $sensor.apiKey (not $sensor.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openctem.sensorSecretName" (dict "context" . "sensor" $sensor) }}
  labels:
    {{- include "openctem.sensorLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "openctem.sensorSecretKey" (dict "sensor" $sensor) }}: {{ $sensor.apiKey | quote }}
{{- end }}

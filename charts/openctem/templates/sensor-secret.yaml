{{- $sensor := include "openctem.sensor" . | fromYaml -}}
{{- if and $sensor.enabled (not $sensor.existingSecret) }}
{{- $credential := $sensor.apiKey }}
{{- if not $credential }}
{{- fail "sensor.enabled=true requires either sensor.apiKey or sensor.existingSecret: create a sensor under Settings → Sensors and use its API key" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openctem.sensorSecretName" (dict "context" . "sensor" $sensor) }}
  labels:
    {{- include "openctem.sensorLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "openctem.sensorSecretKey" (dict "sensor" $sensor) }}: {{ $credential | quote }}
{{- end }}

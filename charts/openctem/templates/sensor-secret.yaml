{{- $sensor := include "openctem.sensor" . | fromYaml -}}
{{- if and $sensor.enabled (not $sensor.existingSecret) }}
{{- $credential := "" }}
{{- if eq $sensor.mode "platform" }}
{{- $credential = $sensor.bootstrapToken }}
{{- if not $credential }}
{{- fail "sensor.mode=platform requires either sensor.bootstrapToken or sensor.existingSecret (the bootstrap token the sensor self-registers with)" }}
{{- end }}
{{- else }}
{{- $credential = $sensor.apiKey }}
{{- if not $credential }}
{{- fail "sensor.enabled=true (mode daemon) requires either sensor.apiKey or sensor.existingSecret: create a sensor under Settings → Sensors and use its API key" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openctem.sensorSecretName" (dict "context" . "sensor" $sensor) }}
  labels:
    {{- include "openctem.sensorLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "openctem.sensorSecretKey" (dict "sensor" $sensor) }}: {{ $credential | quote }}
{{- end }}

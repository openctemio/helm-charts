apiVersion: apps/v1
kind: Deployment
{{- $uiSecretChecksumSource := include "openctem.uiSecretChecksumSource" . | trim }}
metadata:
  name: {{ include "openctem.uiFullname" . }}
  labels:
    {{- include "openctem.uiLabels" . | nindent 4 }}
spec:
  {{- with .Values.ui.deploymentStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if not .Values.ui.autoscaling.enabled }}
  replicas: {{ .Values.ui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openctem.uiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.ui.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $uiSecretChecksumSource }}
        checksum/ui-secret: {{ $uiSecretChecksumSource | sha256sum }}
        {{- end }}
      labels:
        {{- include "openctem.uiLabels" . | nindent 8 }}
        {{- with .Values.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openctem.uiServiceAccountName" . }}
      {{- with .Values.ui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          {{- with .Values.ui.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: BACKEND_API_URL
              {{- if .Values.ui.config.backendUrl }}
              value: {{ .Values.ui.config.backendUrl | quote }}
              {{- else }}
              value: "http://{{ include "openctem.apiFullname" . }}:{{ .Values.api.service.port }}"
              {{- end }}
            - name: NODE_ENV
              value: {{ .Values.ui.config.nodeEnv | quote }}
            # -- The UI reads CSRF_SECRET (web/src/lib/env.ts), not CSRF_TOKEN.
            - name: CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "openctem.uiSecretName" . }}
                  key: {{ .Values.ui.secret.csrfTokenKey }}
            {{- if include "openctem.gatewayMode" . }}
            {{- $uiEnvNames := list }}
            {{- range $e := .Values.ui.extraEnv }}
            {{- if kindIs "map" $e }}{{- $uiEnvNames = append $uiEnvNames (toString ($e.name | default "")) }}{{- end }}
            {{- end }}
            {{- if not (has "TRUST_PROXY_HEADERS" $uiEnvNames) }}
            # The gateway (or ingress controller) in front sets X-Real-IP /
            # X-Forwarded-For, so pass them on to the API (audit log, IP
            # allowlists). networkPolicy.enabled keeps other pods off the UI.
            - name: TRUST_PROXY_HEADERS
              value: "true"
            {{- end }}
            {{- end }}
          {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            {{- with .Values.ui.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.ui.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.ui.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

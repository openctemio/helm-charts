apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openctem.uiFullname" . }}
  labels:
    {{- include "openctem.uiLabels" . | nindent 4 }}
spec:
  {{- with .Values.ui.deploymentStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if not .Values.ui.autoscaling.enabled }}
  replicas: {{ .Values.ui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openctem.uiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.ui.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "openctem.uiLabels" . | nindent 8 }}
        {{- with .Values.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openctem.uiServiceAccountName" . }}
      automountServiceAccountToken: {{ .Values.ui.serviceAccount.automount }}
      {{- with .Values.ui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          {{- with .Values.ui.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: BACKEND_API_URL
              {{- if .Values.ui.config.backendUrl }}
              value: {{ .Values.ui.config.backendUrl | quote }}
              {{- else }}
              value: "http://{{ include "openctem.apiFullname" . }}:{{ .Values.api.service.port }}"
              {{- end }}
            {{- if .Values.admin.listener.enabled }}
            # The platform console's proxy talks to the API's console listener.
            - name: ADMIN_API_URL
              value: "http://{{ include "openctem.apiFullname" . }}-admin:{{ .Values.admin.listener.port }}"
            {{- end }}
            {{- if include "openctem.adminSiteOn" . }}
            # The console has its own site on the bundled gateway: serve it
            # only there, and never on the main site.
            - name: OPENCTEM_ADMIN_PLANE
              value: separate
            {{- end }}
            - name: NODE_ENV
              value: {{ .Values.ui.config.nodeEnv | quote }}
            {{- if include "openctem.gatewayMode" . }}
            {{- $uiEnvNames := list }}
            {{- range $e := .Values.ui.extraEnv }}
            {{- if kindIs "map" $e }}{{- $uiEnvNames = append $uiEnvNames (toString ($e.name | default "")) }}{{- end }}
            {{- end }}
            {{- if not (has "TRUST_PROXY_HEADERS" $uiEnvNames) }}
            # The gateway (or ingress controller) in front sets X-Real-IP /
            # X-Forwarded-For, so pass them on to the API (audit log, IP
            # allowlists). networkPolicy.enabled keeps other pods off the UI.
            - name: TRUST_PROXY_HEADERS
              value: "true"
            {{- end }}
            {{- $publicUrl := include "openctem.gatewayPublicUrl" . }}
            {{- if and $publicUrl (not (has "NEXT_PUBLIC_APP_URL" $uiEnvNames)) }}
            # The public origin, for the console's Content-Security-Policy
            # (the API's APP_URL). Without it the policy allows any https:
            # origin.
            - name: NEXT_PUBLIC_APP_URL
              value: {{ $publicUrl | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            {{- with .Values.ui.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.ui.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # The root filesystem is read-only; Next.js writes only these.
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
            {{- with .Values.ui.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: next-cache
          emptyDir:
            {{- with .Values.ui.cacheSizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        {{- with .Values.ui.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "openctem.uiFullname" . }}
  labels:
    {{- include "openctem.uiLabels" . | nindent 4 }}
  {{- with .Values.ui.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if .Values.ui.service.nodePort }}
      nodePort: {{ .Values.ui.service.nodePort | int }}
      {{- end }}
  selector:
    {{- include "openctem.uiSelectorLabels" . | nindent 4 }}

# =============================================================================
# OpenCTEM — production values example.
#
# Copy, fill in every <PLACEHOLDER>, create the Secrets below, and deploy with:
#   helm upgrade --install openctem openctemio/openctem \
#     -n openctem --create-namespace -f values-production.yaml
#
# No secret is written in this file: every credential comes from a Secret
# you create first (or with External Secrets / sealed-secrets):
#   kubectl create namespace openctem
#   kubectl -n openctem create secret generic openctem-api-secrets \
#     --from-literal=APP_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
#     --from-literal=AUTH_JWT_SECRET="$(openssl rand -hex 64)"
#   kubectl -n openctem create secret generic openctem-db \
#     --from-literal=DB_USER=openctem_app --from-literal=DB_PASSWORD='...'
#   kubectl -n openctem create secret generic openctem-db-migrator \
#     --from-literal=DB_MIGRATE_USER=openctem_migrator --from-literal=DB_MIGRATE_PASSWORD='...'
#   kubectl -n openctem create secret generic openctem-redis \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -base64 32)"
#   kubectl -n openctem create secret generic openctem-attachments-s3 \
#     --from-literal=STORAGE_ACCESS_KEY=... --from-literal=STORAGE_SECRET_KEY=...
# Back up openctem-api-secrets outside the cluster: a lost encryption key makes
# every stored integration credential unreadable.
#
# WHY this file exists: with api.appEnv=production (the chart default) the API
# runs validateProduction() as a HARD BOOT GATE. It will refuse to start unless
# DB TLS, Redis TLS + a strong Redis password, a >=64-char JWT secret, an
# encryption key, and secure cookies are all provided. That is the correct
# secure-by-default posture. Everything marked REQUIRED below is load-bearing.
#
# The bundled Bitnami Postgres/Redis subcharts are turned OFF here: production
# should use managed/external datastores with TLS. (The bundled Redis cannot
# terminate TLS, so it can never satisfy the production Redis gate.)
# =============================================================================

api:
  appEnv: "production"          # REQUIRED to stay "production" for a real deployment

  # One API replica until the API supports several (see values.yaml
  # api.allowMultipleReplicas): 2+ replicas double-fire scheduled scans and
  # fork the audit hash chain today.
  replicaCount: 1

  image:
    repository: ghcr.io/openctemio/openctem-api
    tag: ""                     # defaults to chart appVersion

  auth:
    provider: "local"           # built-in email/password (product default)
    cookieSecure: true          # REQUIRED true in production (HTTPS)
    # REQUIRED: >= 64 chars. Rotating it logs everyone out: keep it STABLE.
    existingSecret: openctem-api-secrets
    jwtSecretKey: AUTH_JWT_SECRET

  encryption:
    # REQUIRED. AES-256-GCM key for integration credentials at rest. A
    # rotated or lost key makes ALL stored credentials undecryptable.
    existingSecret: openctem-api-secrets
    keyRef: APP_ENCRYPTION_KEY

  redis:
    tlsEnabled: true            # REQUIRED true in production
    tlsSkipVerify: false        # REQUIRED false in production
    # A Redis certificate from a private CA: a Secret with the CA (ca.crt).
    # ca:
    #   existingSecret: openctem-redis-ca

  migrations:
    # Drives DB_SSLMODE for BOTH the migration Job and the API container.
    # REQUIRED to be a TLS mode ('require' / 'verify-ca' / 'verify-full') in
    # prod. verify-full with a private CA: database.tls.ca.existingSecret.
    sslMode: require

  # Resource requests are needed for the CPU-target HPA below.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

  autoscaling:
    enabled: false              # re-enable (min 2) once api.allowMultipleReplicas is supported
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70

  # REQUIRED with more than one API replica: attachments every pod can reach.
  # Either an S3-compatible bucket (below), or a ReadWriteMany volume:
  #   attachments: { storage: local, persistence: { accessModes: [ReadWriteMany], storageClass: <RWX_CLASS> } }
  # The chart refuses to render several replicas on a ReadWriteOnce volume.
  attachments:
    storage: s3
    s3:
      provider: s3                    # minio for MinIO / S3-compatible stores
      bucket: "<REQUIRED_ATTACHMENTS_BUCKET>"
      region: ""                      # e.g. eu-west-1
      endpoint: ""                    # empty = AWS S3; e.g. http://minio.storage.svc:9000
      # Secret with keys STORAGE_ACCESS_KEY and STORAGE_SECRET_KEY:
      #   kubectl -n openctem create secret generic openctem-attachments-s3 \
      #     --from-literal=STORAGE_ACCESS_KEY=... --from-literal=STORAGE_SECRET_KEY=...
      existingSecret: openctem-attachments-s3

  # A PodDisruptionBudget with minAvailable 1 on a single replica would block
  # node drains, so it is off until the API runs 2+ replicas again.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  # Spread the 2+ API replicas across nodes (soft: schedule anyway if it can't).
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: api

  # No public sign-up; only the platform administrator creates organizations
  # (the default).
  signupMode: disabled

  # Give a fresh install its first logins: the platform admin + a break-glass
  # backup (temporary passwords in the Job log), and the first organization,
  # whose owner gets a one-time set-password link (emailed when the platform
  # has an SMTP server, otherwise printed in the Job log). Read the log once,
  # store the credentials, then delete the Job (see NOTES).
  bootstrapAdmin:
    enabled: true
    email: "admin@example.com"          # <-- platform administrator
    name: "Platform Admin"
    role: super_admin
    backupEmail: "breakglass@example.com"  # <-- break-glass backup admin
    backupName: "Break-glass Admin"
    org:
      name: "Example Org"               # <-- first organization
      slug: "example-org"
      ownerEmail: "owner@example.com"   # <-- organization owner (not an admin)
      ownerName: "Org Owner"
    # A headless install can store the platform SMTP server here so the
    # owner's link is e-mailed (change it later in Console > System > E-mail):
    # extraEnv:
    #   - name: BOOTSTRAP_SMTP_HOST
    #     value: smtp.example.com
    #   - name: BOOTSTRAP_SMTP_FROM
    #     value: openctem@example.com
    #   - name: BOOTSTRAP_SMTP_USER
    #     value: openctem
    #   - name: BOOTSTRAP_SMTP_PASSWORD
    #     valueFrom: { secretKeyRef: { name: openctem-smtp, key: password } }

ui:
  replicaCount: 2

  image:
    repository: ghcr.io/openctemio/openctem-web
    tag: ""

  config:
    nodeEnv: "production"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: ui

# -----------------------------------------------------------------------------
# ONE public host for the console, the API and sensors. It also sets the API's
# APP_URL, CORS_ALLOWED_ORIGINS and SMTP_BASE_URL (e-mail links, SAML, the
# sensor endpoint), which every production install needs.
# This example uses your ingress-nginx + cert-manager. Sensors then use the
# protocol v3 HTTPS binding. To also carry the sensor gRPC binding on port 443
# (ALPN, like the Compose stack), use the bundled gateway instead:
#   gateway: { mode: caddy, caddy: { tls: { mode: acme, acme: { email: ops@example.com } } } }
# See the chart README, "Single-port gateway", for httpRoute and caddy (a plain
# Ingress cannot route API-key clients on generic /api/v1/* paths).
# -----------------------------------------------------------------------------
gateway:
  mode: ingress
  host: ctem.example.com              # <-- your host
  trustedProxies: [10.244.0.0/16]     # <-- your cluster's pod CIDR
  ingress:
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "256m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    tls:
      enabled: true
      secretName: openctem-tls
      clusterIssuer: letsencrypt-prod

# The API's Prometheus metrics behind a bearer token (METRICS_TOKEN, generated
# into a Secret and kept across upgrades). Add monitoring.serviceMonitor /
# prometheusRule with the Prometheus Operator.
monitoring:
  enabled: true

# -----------------------------------------------------------------------------
# External PostgreSQL (TLS REQUIRED in production)
# -----------------------------------------------------------------------------
postgresql:
  enabled: false                # use an external / managed Postgres

database:
  host: "<REQUIRED_DB_HOST>"    # e.g. postgres.internal or RDS endpoint
  port: 5432
  name: openctem
  auth:
    # The API's role (DB_USER + DB_PASSWORD): DML only, created by the openctem
    # script api/deploy/postgres/least-privilege-roles.sql (run once as the
    # superuser).
    existingSecret: openctem-db
    createSecret: false
    userKey: DB_USER
    passwordKey: DB_PASSWORD
  # Migration Jobs connect as the schema owner, never as the API's role.
  migrator:
    existingSecret: openctem-db-migrator
    userKey: DB_MIGRATE_USER
    passwordKey: DB_MIGRATE_PASSWORD
  # A server certificate from a private CA (sslMode verify-ca / verify-full):
  # tls:
  #   ca:
  #     existingSecret: openctem-db-ca    # key ca.crt

# -----------------------------------------------------------------------------
# External Redis (TLS + >=32-char password REQUIRED in production)
# -----------------------------------------------------------------------------
redis:
  enabled: false                # bundled Redis cannot do TLS — use external

redisConfig:
  host: "<REQUIRED_REDIS_HOST>"
  port: 6379
  db: 0
  auth:
    # REQUIRED >= 32 chars in production (key REDIS_PASSWORD).
    existingSecret: openctem-redis
    createSecret: false
    passwordKey: REDIS_PASSWORD

# -----------------------------------------------------------------------------
# NetworkPolicy — recommended in production (requires a CNI that enforces it).
# Default-deny ingress to the release's pods + allow only the real flows.
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: true
  # Point at the namespace your ingress controller runs in so only it can reach
  # the UI. Example for ingress-nginx installed in namespace "ingress-nginx":
  ingressControllerNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx
  api:
    egress:
      # Keep true unless you can enumerate every threat-intel / CVE / CT-feed
      # endpoint. When external Postgres/Redis are used (this file), set false
      # ONLY if you also add their CIDRs (and DNS is auto-included) under extra.
      allowAll: true
      extra: []
      # - to:
      #     - ipBlock:
      #         cidr: 10.0.0.0/8       # managed Postgres/Redis subnet
      #   ports:
      #     - { port: 5432, protocol: TCP }
      #     - { port: 6379, protocol: TCP }

# =============================================================================
# OpenCTEM: resource preset "small" (up to 50 users, 10k assets, 3 sensors).
#
# Layer it over your production values; the later file wins:
#   helm upgrade --install openctem openctemio/openctem -n openctem \
#     -f values-production.yaml -f values-small.yaml
#
# Only resources, replica counts, connection pool and volume sizes are set
# here. The numbers come from the sizing guide (docs.openctem.io/install/sizing),
# which says which are measured and which are extrapolated. PostgreSQL and
# Redis are external in production: size them from the same guide.
#
# api.extraEnv below replaces an api.extraEnv list from an earlier file
# (Helm does not merge lists): if you set your own, copy these two entries in.
# =============================================================================

api:
  # One API instance (background jobs are not yet coordinated across
  # instances); give it CPU and memory instead.
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  extraEnv:
    # The Go runtime collects garbage before it reaches the container limit.
    - name: GOMEMLIMIT
      value: "1600MiB"
    # Keep below PostgreSQL max_connections minus the migration job and
    # admin sessions.
    - name: DB_MAX_OPEN_CONNS
      value: "25"

ui:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2

gateway:
  caddy:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

# Applies when sensor.enabled is true (a sensor running in this cluster).
sensor:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  data:
    persistence:
      size: 8Gi
  content:
    persistence:
      size: 5Gi
  outbox:
    persistence:
      size: 2Gi

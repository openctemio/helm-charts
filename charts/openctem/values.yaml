# Default values for openctem.
# This is a YAML-formatted file.

nameOverride: ""
fullnameOverride: ""

# Shared image pull secrets for all components.
imagePullSecrets: []

api:
  replicaCount: 1

  image:
    repository: openctemio/api
    pullPolicy: IfNotPresent
    tag: ""

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}
  securityContext: {}

  deploymentStrategy: {}
    # type: RollingUpdate
    # rollingUpdate:
    #   maxSurge: 1
    #   maxUnavailable: 0

  service:
    type: ClusterIP
    port: 80
    annotations: {}
    nodePort:

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: api.chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

  # -- Expose API service via gateway-api HTTPRoute
  httpRoute:
    enabled: false
    annotations: {}
    parentRefs:
      - name: gateway
        sectionName: http
    hostnames:
      - api.chart-example.local
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

  resources: {}

  livenessProbe:
    httpGet:
      path: /health
      port: http
  readinessProbe:
    httpGet:
      path: /health
      port: http

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  volumes: []
  volumeMounts: []

  nodeSelector: {}
  tolerations: []
  affinity: {}

  extraEnv: []
  # - name: LOG_LEVEL
  #   value: "debug"
  extraEnvFrom: []
  # - configMapRef:
  #     name: openctem-extra-config
  # - secretRef:
  #     name: openctem-extra-secret

ui:
  replicaCount: 1

  image:
    repository: openctemio/ui
    pullPolicy: IfNotPresent
    tag: ""

  config:
    nodeEnv: "production"
    # -- keep blank to set default backend url as the internal api service
    backendUrl: ""
  
  secret:
    # -- Existing UI secret.
    existingSecret: ""
    # -- Create UI secret when existingSecret is not set.
    createSecret: true
    csrfTokenKey: CSRF_TOKEN
    # -- Leave empty to auto-generate like `openssl rand -base64 32`.
    csrfToken: ""

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}
  securityContext: {}

  deploymentStrategy: {}
    # type: RollingUpdate
    # rollingUpdate:
    #   maxSurge: 1
    #   maxUnavailable: 0

  service:
    type: ClusterIP
    port: 80
    annotations: {}
    nodePort:

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: ui.chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

  # -- Expose UI service via gateway-api HTTPRoute
  httpRoute:
    enabled: false
    annotations: {}
    parentRefs:
      - name: gateway
        sectionName: http
    hostnames:
      - ui.chart-example.local
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

  resources: {}

  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  volumes: []
  volumeMounts: []

  nodeSelector: {}
  tolerations: []
  affinity: {}

  extraEnv:
  # - name: ENABLE_TOKEN_REFRESH
  #   value: "false"
  extraEnvFrom:
  # - configMapRef:
  #     name: openctem-extra-config
  # - secretRef:
  #     name: openctem-extra-secret

database:
  # -- Settings in this section are used only when postgresql.enabled=false.
  host: ""
  port: 5432
  name: openctem
  auth:
    # -- Existing secret containing DB_USER and DB_PASSWORD keys.
    existingSecret: ""
    # -- Create credentials secret from values below when existingSecret is not set.
    createSecret: true
    userKey: DB_USER
    passwordKey: DB_PASSWORD
    username: ""
    password: ""

postgresql:
  # -- Deploy bundled Bitnami PostgreSQL subchart.
  enabled: true
  auth:
    username: "openctem"
    password: ""
    database: openctem

redisConfig:
  # -- Settings in this section are used only when redis.enabled=false.
  host: ""
  port: 6379
  db: 0
  auth:
    # -- Existing secret containing REDIS_PASSWORD key.
    existingSecret: ""
    # -- Create password secret from values below when existingSecret is not set.
    createSecret: true
    passwordKey: REDIS_PASSWORD
    password: ""

redis:
  # -- Deploy bundled Bitnami Redis subchart.
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: redis-password

# Extra manifests to be deployed alongside the chart.
extraManifests: []
# - apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret

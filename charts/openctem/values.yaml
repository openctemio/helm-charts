# Default values for openctem.
# This is a YAML-formatted file.

nameOverride: ""
fullnameOverride: ""

# Shared image pull secrets for all components.
imagePullSecrets: []

api:
  # -- Replica count. Default 1 for dev/eval. PRODUCTION should run >= 2 for HA
  # (see values-production.yaml) so a node drain / rolling upgrade keeps the API
  # serving. With >= 2 replicas also enable podDisruptionBudget and set
  # topologySpreadConstraints (below) so the replicas don't co-locate.
  replicaCount: 1

  # -- Application environment. "production" (the secure default) turns
  # validateProduction() into a HARD BOOT GATE: it requires DB TLS, Redis TLS +
  # a >=32-char Redis password, a >=64-char JWT secret, an encryption key, and
  # secure cookies — the API refuses to start otherwise. Set to "development"
  # or "staging" ONLY as a conscious opt-out (e.g. to run the bundled, non-TLS
  # Redis for a demo). See values-production.yaml for the required prod values.
  appEnv: "production"

  auth:
    # -- AUTH_PROVIDER: "local" (built-in email/password, the product default),
    # "oidc" (Keycloak) or "hybrid". "oidc"/"hybrid" additionally require the
    # Keycloak block to be configured in production.
    provider: "local"
    # -- AUTH_COOKIE_SECURE — must be true in production (HTTPS).
    cookieSecure: true
    # -- JWT signing secret (AUTH_JWT_SECRET). STABLE across upgrades — rotating
    # it logs every user out. Leave blank to auto-generate-once and persist (via
    # cluster lookup); production should set an explicit value or existingSecret.
    # Must be >= 64 characters in production.
    jwtSecret: ""
    # -- Source AUTH_JWT_SECRET from an existing Secret instead of the chart.
    existingSecret: ""
    jwtSecretKey: AUTH_JWT_SECRET

  encryption:
    # -- APP_ENCRYPTION_KEY (AES-256-GCM) for integration credentials at rest.
    # Without it, non-dev deployments refuse to boot; a wrong/rotated key makes
    # all stored credentials undecryptable. STABLE across upgrades — never
    # rotated automatically. Leave blank to auto-generate-once and persist;
    # production should set an explicit value or existingSecret.
    # Accepts 32 raw / 64 hex / 44 base64 chars.
    key: ""
    # -- Source APP_ENCRYPTION_KEY from an existing Secret instead of the chart.
    existingSecret: ""
    keyRef: APP_ENCRYPTION_KEY

  redis:
    # -- REDIS_TLS_ENABLED. Production REQUIRES TLS. The bundled Bitnami Redis
    # does not terminate TLS, so production must point at an external Redis with
    # TLS (redis.enabled=false + redisConfig.*) and set this true.
    tlsEnabled: false
    # -- REDIS_TLS_SKIP_VERIFY — must stay false in production.
    tlsSkipVerify: false

  image:
    repository: ghcr.io/openctemio/api
    pullPolicy: IfNotPresent
    tag: ""

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  # -- Pod-level security context (safe non-root defaults; API image runs as uid 1000).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level security context. readOnlyRootFilesystem is left OFF: the
  # API writes local attachment storage under /app/data; enable it only with a
  # writable volume mounted there.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    # readOnlyRootFilesystem: true

  # -- Who may create organizations (TENANT_CREATION_MODE).
  #    admin_only    — only the platform administrator creates organizations:
  #                    in the admin console (/admin -> Organizations) or with
  #                    the bootstrap-admin org flags (api.bootstrapAdmin.org).
  #                    The default, and the right setting for self-hosted and
  #                    on-prem installs.
  #    self_service  — any signed-in user may create organizations (and owns
  #                    each one). SaaS / trial opt-in only.
  #    A TENANT_CREATION_MODE entry in api.extraEnv takes precedence.
  tenantCreationMode: admin_only

  # -- The sensor release channel the Sensors page compares each sensor's
  #    version with, and the tag the page's install commands pin.
  #    latestVersion (SENSOR_LATEST_VERSION): empty = sensor.image.tag, so the
  #    bundled sensor and the install commands run the same release.
  #    minVersion (SENSOR_MIN_VERSION): empty = no minimum; a heartbeating
  #    sensor below it shows as degraded ("version unsupported").
  #    An entry for either name in api.extraEnv takes precedence.
  sensorReleaseChannel:
    latestVersion: ""
    minVersion: ""

  # -- Bootstrap the first PLATFORM administrators (RFC-022) and, optionally,
  # the first organization. Runs /app/bootstrap-admin as a post-install hook
  # Job after the migrations.
  #
  # The primary admin and a break-glass backup super admin are each created as
  # a sign-in account with a temporary password printed ONCE to the Job log.
  # Both sign in on /login, enroll an authenticator when opening the admin
  # console (/admin), and must change the temporary password first. The backup
  # is local (never bound to the platform identity provider, exempt from
  # "require IdP"); every sign-in with it is audited (high), logged with
  # alert=break_glass_sign_in and emailed to the other admins (system SMTP).
  # Store its credentials offline and test it at least every 90 days.
  #
  # The completed Job (and its log) is KEPT until you delete it: read the
  # credentials with `kubectl logs job/<fullname>-api-bootstrap-admin` (the
  # exact command is in NOTES), store them, then `kubectl delete job/...`. Re-running is
  # safe: existing admins are left unchanged and an existing organization slug
  # is skipped; any other error fails the Job and the release.
  bootstrapAdmin:
    enabled: false
    email: ""
    name: ""
    role: super_admin
    # -- Break-glass backup administrator (required unless noBackup=true).
    backupEmail: ""
    backupName: ""
    # -- Skip the break-glass backup (not recommended).
    noBackup: false
    force: false
    # -- First organization (optional). Set name AND ownerEmail together.
    #    Created through the normal, audited organization service. The owner
    #    gets a one-time set-password link (valid 24h): emailed when SMTP is
    #    configured (SMTP_* in api.extraEnv / api.extraEnvFrom; the link base
    #    is SMTP_BASE_URL, set by gateway.* or api.extraEnv), otherwise
    #    printed once to the Job log. The owner must not be one of the
    #    platform admins (admins cannot be organization members).
    org:
      # -- Organization name, e.g. "Acme Security".
      name: ""
      # -- URL slug. Empty: derived from the name.
      slug: ""
      # -- Owner's email (a new sign-in account unless it already exists).
      ownerEmail: ""
      # -- Owner's display name. Empty: derived from the email.
      ownerName: ""
    # -- Retries. 0: a failure is reported once, never retried (each attempt
    #    would print a new log the operator has to find).
    backoffLimit: 0
    activeDeadlineSeconds: 300

  # NOTE: api.bootstrapTenant (the /app/bootstrap-tenant Job) was removed in
  # chart 0.8.0. Use api.bootstrapAdmin.org.* to create the first organization;
  # rendering fails while api.bootstrapTenant.enabled is true.

  deploymentStrategy: {}
    # type: RollingUpdate
    # rollingUpdate:
    #   maxSurge: 1
    #   maxUnavailable: 0

  service:
    type: ClusterIP
    port: 80
    annotations: {}
    nodePort:

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: api.chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

  # -- Expose API service via gateway-api HTTPRoute
  httpRoute:
    enabled: false
    annotations: {}
    parentRefs:
      - name: gateway
        sectionName: http
    hostnames:
      - api.chart-example.local
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

  # -- CPU requests are REQUIRED for the CPU-target HPA to function.
  # Memory limit is 1Gi (not 512Mi): the Go API does ingest/enrichment and
  # threat-intel loading that spikes memory; 512Mi OOM-kills under load. Tune
  # down only if you have measured a smaller working set.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # -- startupProbe is ENABLED by default: first boot can be slow (app init +
  # threat-intel load) and without it a slow start trips livenessProbe and the
  # kubelet kills the pod in a crash loop. failureThreshold*periodSeconds =
  # 30*5 = up to 150s of grace before liveness takes over. Set to {} to disable.
  startupProbe:
    httpGet:
      path: /health
      port: http
    failureThreshold: 30
    periodSeconds: 5
  livenessProbe:
    httpGet:
      path: /health
      port: http
  readinessProbe:
    httpGet:
      path: /health
      port: http

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # -- Optional PodDisruptionBudget. Set minAvailable OR maxUnavailable.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    maxUnavailable: ""

  volumes: []
  volumeMounts: []

  nodeSelector: {}
  tolerations: []
  # -- Pod affinity/anti-affinity. For HA, spread replicas across nodes. See
  # topologySpreadConstraints below for a lighter-weight alternative; use one or
  # the other. Example soft anti-affinity is in values-production.yaml.
  affinity: {}
  # -- topologySpreadConstraints (values-driven, templated). Keeps the >= 2
  # replicas off a single node/zone. Empty by default; values-production.yaml
  # ships a soft (ScheduleAnyway) hostname spread. Supports `tpl` for dynamic
  # label values.
  topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: kubernetes.io/hostname
  #   whenUnsatisfiable: ScheduleAnyway
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/component: api

  extraEnv: []
  # - name: LOG_LEVEL
  #   value: "debug"
  extraEnvFrom: []
  # - configMapRef:
  #     name: openctem-extra-config
  # - secretRef:
  #     name: openctem-extra-secret

  migrations:
    # -- Enable the database migrations Job.
    enabled: true

    image:
      repository: ghcr.io/openctemio/migrations
      # -- Image tag for the migrations image. Defaults to .Chart.AppVersion.
      tag: ""
      pullPolicy: IfNotPresent

    # -- Run as a Helm hook (post-install,pre-upgrade). When false, the Job
    # is applied as a plain resource (useful for GitOps flows).
    hooks:
      enabled: true

    # -- Job backoffLimit (retries before Job is marked failed).
    backoffLimit: 2
    # -- Hard timeout for the migration Job in seconds.
    activeDeadlineSeconds: 600

    # -- Override the Postgres sslmode used in the connection URL.
    # Blank = "disable" when postgresql.enabled, otherwise "require".
    sslMode: ""

    resources: {}
    podSecurityContext: {}
    securityContext: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

    # -- Extra environment variables for the migration container.
    extraEnv: []
    # -- Extra args appended BEFORE the "up" subcommand.
    extraArgs: []

    # -- Manual, gated DOWN-migration Job for controlled rollbacks. DISABLED by
    # default. `helm rollback` does NOT down-migrate — it only reverts the
    # Kubernetes manifests, leaving the DB at the NEWER schema. If the older app
    # version is not forward-compatible with that schema you must revert the
    # schema yourself. Enabling this renders a one-shot Job that runs
    # `migrate ... down <steps>`. Run it deliberately (never as an automatic
    # hook), confirm the target step count, and take a DB backup first.
    downMigration:
      enabled: false
      # -- Number of migrations to revert (passed to `migrate ... down N`).
      steps: 1
      backoffLimit: 0
      activeDeadlineSeconds: 600

ui:
  # -- Replica count. Default 1 for dev/eval. PRODUCTION should run >= 2 for HA
  # (see values-production.yaml). Pair with podDisruptionBudget +
  # topologySpreadConstraints when running >= 2.
  replicaCount: 1

  image:
    repository: ghcr.io/openctemio/ui
    pullPolicy: IfNotPresent
    tag: ""

  config:
    nodeEnv: "production"
    # -- keep blank to set default backend url as the internal api service
    backendUrl: ""
  
  secret:
    # -- Existing UI secret.
    existingSecret: ""
    # -- Create UI secret when existingSecret is not set.
    createSecret: true
    # -- Secret data key holding the CSRF secret. The UI reads it as the
    # CSRF_SECRET env var (ui/src/lib/env.ts).
    csrfTokenKey: CSRF_SECRET
    # -- Leave empty to auto-generate like `openssl rand -base64 32`.
    csrfToken: ""

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  # -- Pod-level security context (UI image runs as uid 1001 "nextjs").
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level security context. readOnlyRootFilesystem is left OFF:
  # Next.js writes to .next/cache at runtime.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    # readOnlyRootFilesystem: true

  deploymentStrategy: {}
    # type: RollingUpdate
    # rollingUpdate:
    #   maxSurge: 1
    #   maxUnavailable: 0

  service:
    type: ClusterIP
    port: 80
    annotations: {}
    nodePort:

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: ui.chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

  # -- Expose UI service via gateway-api HTTPRoute
  httpRoute:
    enabled: false
    annotations: {}
    parentRefs:
      - name: gateway
        sectionName: http
    hostnames:
      - ui.chart-example.local
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

  # -- CPU requests are REQUIRED for the CPU-target HPA to function.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # -- Optional startupProbe. Empty {} disables it.
  startupProbe: {}
    # httpGet:
    #   path: /
    #   port: http
    # failureThreshold: 30
    # periodSeconds: 5
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # -- Optional PodDisruptionBudget. Set minAvailable OR maxUnavailable.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    maxUnavailable: ""

  volumes: []
  volumeMounts: []

  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- topologySpreadConstraints (values-driven, templated). See api section.
  topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: kubernetes.io/hostname
  #   whenUnsatisfiable: ScheduleAnyway
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/component: ui

  extraEnv:
  # - name: ENABLE_TOKEN_REFRESH
  #   value: "false"
  extraEnvFrom:
  # - configMapRef:
  #     name: openctem-extra-config
  # - secretRef:
  #     name: openctem-extra-secret

# =============================================================================
# Gateway: one public HTTPS entry point for the UI AND the REST API
# =============================================================================
# One hostname fronts both services (like Tenable.sc). Requests are routed by
# path (and, where the router can, by credential):
#
#   to the API service
#     /api/v1/agent/  /api/v2/sensor/  /api/v1/platform/   sensors
#     /scim/v2/                                            SCIM provisioning
#     /api/v1/mcp                                          MCP (oct_ key)
#     /api/v1/webhooks/incoming/                           Jira/GitHub webhooks
#     /api/v1/auth/saml/                                   SAML metadata, login, ACS
#     /api/v1/auth/backchannel-logout                      OIDC back-channel logout
#     /api/v1/ws                                           browser WebSocket
#     /health  /openapi.yaml  /docs                        (exact paths)
#     /api/* with `Authorization: Bearer oct_*` or an `X-API-Key` header
#                                       (API-key clients; caddy + httpRoute)
#     /api/* with `Authorization: Bearer *` and no `auth_token` session cookie
#                                       (other token clients; caddy only)
#   never routed to the API: /metrics, /ready, /debug/* (caddy answers 404; the
#   ingress/httpRoute modes send them to the UI, which has no such pages), and
#   the API's other ports (9090 gRPC, 2345 Delve) are never exposed.
#   everything else to the UI service, including the browser's cookie calls to
#   /api/v1/*, which the UI's proxy authenticates.
#
# Why the credential rule matters: the UI's /api/v1 proxy authenticates with the
# browser's session cookie and DROPS the caller's Authorization header, so an
# API-key client calling a generic /api/v1/* path through the UI gets 401.
# A plain Kubernetes Ingress cannot match headers, so in `ingress` mode only
# the dedicated API paths above work for API-key clients. If you need
# API keys on every /api/v1/* path, use `httpRoute` (header matches) or
# `caddy` (all rules; it can also sit behind your existing ingress/LB in
# caddy.tls.mode=http).
#
# Enabling a mode also configures the API and UI for it:
#   API: SERVER_TRUSTED_PROXIES = trustedProxies (only these peers may assert
#        a client IP via X-Real-IP / X-Forwarded-For); APP_URL,
#        CORS_ALLOWED_ORIGINS and SMTP_BASE_URL = publicUrl (SAML SP URLs derive
#        from APP_URL; the API checks the WebSocket Origin against
#        CORS_ALLOWED_ORIGINS). A name you already set in api.extraEnv wins.
#   UI:  TRUST_PROXY_HEADERS=true (forward the client IP to the API).
# The per-component api.ingress / ui.ingress / *.httpRoute keep working; do not
# point them at the same host as the gateway.
gateway:
  # -- none (default; nothing changes) | ingress | httpRoute | caddy
  mode: none
  # -- Public hostname (DNS name, or an IP address in caddy internal/files
  # mode). Required for every mode except caddy with tls.mode=http.
  host: ""
  # -- Public origin, used for APP_URL, CORS_ALLOWED_ORIGINS and SMTP_BASE_URL.
  # Default: https://<host>. Set it when clients use a non-443 port
  # (e.g. https://ctem.example.com:8443) or in caddy http mode.
  publicUrl: ""
  # -- REQUIRED when mode != none: CIDRs/IPs the API trusts to report the
  # client address (SERVER_TRUSTED_PROXIES). These are the hops that connect
  # to the API: the gateway pods (or the ingress controller / Gateway pods)
  # and the UI pods. Pod IPs change, so give the cluster's POD CIDR, e.g.
  #   kubeadm+flannel 10.244.0.0/16, k3s 10.42.0.0/16, GKE/EKS: the VPC/pod range.
  #   kubectl cluster-info dump | grep -m1 -- --cluster-cidr
  # Anything outside this list is recorded as its own TCP peer, so nothing can
  # choose the IP written to the audit log or matched by IP allowlists.
  trustedProxies: []

  # ---------------------------------------------------------------------------
  # mode: ingress  -- one networking.k8s.io/v1 Ingress, path rules only.
  # ---------------------------------------------------------------------------
  ingress:
    className: ""
    # -- Controller-specific annotations. WebSockets and large uploads usually
    # need tuning, e.g. for ingress-nginx:
    #   nginx.ingress.kubernetes.io/proxy-body-size: "256m"
    #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    annotations: {}
    tls:
      # -- Terminate TLS at the ingress for `host`.
      enabled: true
      # -- kubernetes.io/tls Secret. Default: <fullname>-gateway-tls (which
      # cert-manager creates when an issuer below is set).
      secretName: ""
      # -- Convenience: adds cert-manager.io/cluster-issuer (or .../issuer).
      clusterIssuer: ""
      issuer: ""

  # ---------------------------------------------------------------------------
  # mode: httpRoute  -- one gateway.networking.k8s.io/v1 HTTPRoute. TLS is
  # configured on the Gateway's listener, not here. Header matches need a
  # Gateway implementation that supports RegularExpression header matching
  # (Extended conformance: Envoy Gateway, Istio, Cilium, NGINX Gateway Fabric,
  # Traefik ...). Gateway API has no "header absent" match, so the
  # "Bearer token without a session cookie" rule is caddy-only: non-oct_
  # bearer tokens must use the dedicated API paths.
  # ---------------------------------------------------------------------------
  httpRoute:
    annotations: {}
    parentRefs:
      - name: gateway
        sectionName: https
    # -- Route /api/* with `Authorization: Bearer oct_*` or `X-API-Key` to the API.
    apiKeyHeaderRouting: true

  # ---------------------------------------------------------------------------
  # mode: caddy  -- bundled Caddy (for clusters without an ingress controller).
  # The Caddyfile is the same file the docker-compose deployment uses
  # (files/gateway/). One replica: its certificates and internal CA live on a
  # ReadWriteOnce volume.
  # ---------------------------------------------------------------------------
  caddy:
    image:
      repository: caddy
      tag: "2.11.4-alpine"
      pullPolicy: IfNotPresent
    tls:
      # -- internal | acme | files | http
      #   internal: certificates from Caddy's own CA (LAN / IP installs). Give
      #             sensors and browsers the root (see NOTES after install).
      #   acme:     Let's Encrypt (or acme.ca) for a public DNS name; needs 443
      #             reachable from the Internet (TLS-ALPN-01), or enable
      #             service.http for HTTP-01 and the HTTP->HTTPS redirect.
      #   files:    your certificate: a kubernetes.io/tls Secret (files.secretName).
      #   http:     plain HTTP on port 80, ONLY behind a proxy that terminates
      #             TLS; refused unless allowPlainHttp=true.
      mode: internal
      acme:
        email: ""
        ca: "https://acme-v02.api.letsencrypt.org/directory"
      files:
        # -- kubernetes.io/tls Secret with tls.crt (full chain) and tls.key.
        secretName: ""
        certKey: tls.crt
        keyKey: tls.key
      # -- Must be true to use tls.mode=http (no encryption between the client
      # and this gateway unless a TLS proxy sits in front).
      allowPlainHttp: false
    # -- CIDRs of proxies IN FRONT of Caddy whose X-Forwarded-For Caddy
    # believes (tls.mode=http behind an L7 proxy). Empty: none.
    frontProxies: []
    # -- Largest request body (the API enforces the real per-route limits).
    maxBodySize: 256MB
    service:
      # -- LoadBalancer | NodePort | ClusterIP
      type: LoadBalancer
      annotations: {}
      httpsPort: 443
      httpsNodePort:
      # -- Also expose port 80 (acme: HTTP-01 + HTTP->HTTPS redirect). In
      # tls.mode=http port 80 is the only port and is always exposed.
      http:
        enabled: false
        port: 80
        nodePort:
      # -- Local keeps the client's source address (audit log, IP allowlists)
      # for LoadBalancer/NodePort; Cluster SNATs it to a node address.
      externalTrafficPolicy: Local
      loadBalancerIP: ""
      loadBalancerSourceRanges: []
    persistence:
      # -- PersistentVolumeClaim for /data (certificates, ACME account, the
      # internal CA). Keep it: losing it re-issues the internal CA and every
      # sensor and browser must trust the new root. false = emptyDir.
      enabled: true
      existingClaim: ""
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 1Gi
    # -- Caddy runs as a non-root user. The image's caddy binary carries the
    # file capability cap_net_bind_service (to bind 443/80), so the container
    # must keep NET_BIND_SERVICE: with every capability dropped the kernel
    # refuses to execute it. Dropping ALL and adding back only
    # NET_BIND_SERVICE is allowed by the "restricted" Pod Security Standard.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
        add:
          - NET_BIND_SERVICE
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    podAnnotations: {}
    podLabels: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    extraEnv: []

database:
  # -- Settings in this section are used only when postgresql.enabled=false.
  host: ""
  port: 5432
  name: openctem
  auth:
    # -- Existing secret containing DB_USER and DB_PASSWORD keys.
    existingSecret: ""
    # -- Create credentials secret from values below when existingSecret is not set.
    createSecret: true
    userKey: DB_USER
    passwordKey: DB_PASSWORD
    username: ""
    password: ""

# =============================================================================
# Bundled Bitnami PostgreSQL — DEV / EVAL ONLY.
# PRODUCTION: set postgresql.enabled=false and point `database.*` at an external
# managed Postgres with TLS (see values-production.yaml). The bundled subchart
# is single-instance, not backed up, and Bitnami has DEPRECATED its free Docker
# Hub images (supply-chain risk) — do not run it for real data.
# =============================================================================
postgresql:
  # -- Deploy bundled Bitnami PostgreSQL subchart. DEV/EVAL ONLY — see note above.
  enabled: true
  auth:
    username: "openctem"
    password: ""
    database: openctem

redisConfig:
  # -- Settings in this section are used only when redis.enabled=false.
  host: ""
  port: 6379
  db: 0
  auth:
    # -- Existing secret containing REDIS_PASSWORD key.
    existingSecret: ""
    # -- Create password secret from values below when existingSecret is not set.
    createSecret: true
    passwordKey: REDIS_PASSWORD
    password: ""

# =============================================================================
# Bundled Bitnami Redis — DEV / EVAL ONLY.
# PRODUCTION: set redis.enabled=false and point `redisConfig.*` at an external
# managed Redis with TLS + a >= 32-char password. The bundled Redis CANNOT
# terminate TLS, so it can never satisfy the production Redis boot gate. Same
# Bitnami deprecated-image supply-chain caveat as Postgres above.
# =============================================================================
redis:
  # -- Deploy bundled Bitnami Redis subchart. DEV/EVAL ONLY — see note above.
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: redis-password

# =============================================================================
# NetworkPolicy — opt-in micro-segmentation (default OFF for compatibility with
# clusters whose CNI does not enforce NetworkPolicy). When enabled the chart
# renders a default-DENY-ingress baseline plus explicit allow rules for the real
# flows: ingress-controller -> ui, ui -> api, api -> postgres:5432,
# api -> redis:6379, and api egress (DNS + HTTPS for threat-intel / CT feeds).
# =============================================================================
networkPolicy:
  # -- Master switch for all NetworkPolicy resources in this chart.
  enabled: false

  # -- Label selector identifying the namespace(s) your ingress controller runs
  # in, used to allow inbound traffic to the UI. Empty {} allows from ALL
  # namespaces (podSelector only). Example: { kubernetes.io/metadata.name: ingress-nginx }
  ingressControllerNamespaceSelector: {}
  # -- Pod selector for the ingress controller within the namespace above.
  ingressControllerPodSelector: {}

  # -- Egress policy for the API. The API reaches out to threat-intel / CVE /
  # Certificate-Transparency feeds over HTTPS and needs DNS. Kept permissive by
  # default (all egress) so those feeds are not silently broken; tighten
  # `api.egress` to explicit CIDRs/ports if your environment allows it.
  api:
    egress:
      # -- Allow all egress from the API (recommended unless you can enumerate
      # every threat-intel endpoint). When false, only the explicit rules below
      # (DNS + the datastore rules) are permitted.
      allowAll: true
      # -- Extra egress rules (NetworkPolicyEgressRule objects) appended when
      # allowAll=false. Use to pin threat-intel egress to known CIDRs.
      extra: []

# =============================================================================
# helm test — a short-lived connectivity Pod (`helm test <release>`) that curls
# the API /health and the UI / to smoke-verify a release is actually serving.
# =============================================================================
tests:
  enabled: true
  image:
    # -- Small image with wget (busybox). Pinned for reproducibility.
    repository: busybox
    tag: "1.37.0"
    pullPolicy: IfNotPresent
  # -- Overall timeout (seconds) for each curl/wget probe.
  timeoutSeconds: 10

# Extra manifests to be deployed alongside the chart.
extraManifests: []
# - apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata:
#     name: openctem-api-secret
#   spec:
#     secretStoreRef:
#       name: openctem-api-secret-store
#       kind: ClusterSecretStore
#     target:
#       name: openctem-api-secret
#   data:
#     - secretKey: DB_USERNAME
#       remoteRef:
#         key: openctem-api-secret
#         property: DB_USERNAME

# =============================================================================
# Bundled sensor (optional, opt-in)
# =============================================================================
# A co-located OpenCTEM sensor (binary `openctemio-sensor`) in the same release,
# talking to the in-cluster API. It lets the platform work out-of-the-box for
# EXTERNAL-reachable work (public DAST/recon/validate, enrichment) without
# deploying a separate remote sensor.
#
# IMPORTANT — reachability: a co-located sensor can only reach what the cluster
# can route to. Scanning a customer's INTERNAL network still requires a remote
# sensor. Leave allowPrivateTargets empty unless you intend the sensor to touch
# in-cluster/private ranges.
#
# UPGRADING FROM CHART <= 0.4.x: this block was called `agent:`. An old values
# file with `agent:` keeps working — every agent.* key is mapped onto the same
# sensor.* key and `helm upgrade` prints a deprecation notice. The render fails
# only when agent.* and sensor.* set the same key to different values. A
# sensor.* value equal to the chart default below counts as "not set". See the
# chart README, "Upgrading to 0.5.0".
#
# NOTE for chart developers: templates/_helpers.tpl "openctem.sensorDefaults"
# must list exactly these defaults (tests/sensor-migration/run.sh checks it).
sensor:
  # -- Enable the bundled co-located sensor. Disabled by default (opt-in).
  enabled: false
  # -- How the sensor connects to the platform:
  #    "daemon" (default) — an API-key sensor: create a sensor in the UI
  #      (Settings → Sensors → Add), put its API key in apiKey or
  #      existingSecret, and the sensor runs `-daemon -enable-commands`,
  #      executing the scans the platform dispatches (protocol v1).
  #    "platform" — the `-platform` self-registration with a bootstrap token,
  #      which is what chart <= 0.4.x ran. It needs a platform that serves
  #      /api/v1/platform/{register,lease,poll}; the OpenCTEM API (v0.9.0)
  #      serves none of them, so this mode cannot register there. Kept so an
  #      old values file renders unchanged; switch to "daemon".
  mode: daemon
  replicaCount: 1
  image:
    repository: ghcr.io/openctemio/sensor
    # -- Sensor image tag. The sensor is versioned separately from the
    # platform, so this does NOT follow the chart appVersion. The plain tag
    # (v0.4.2, latest; from v0.4.2) is the default image: semgrep,
    # betterleaks, trivy and nuclei, the same as <version>-default. Other
    # variants are <version>-<variant>: -nuclei, -betterleaks, -semgrep,
    # -trivy, and -ci for CI. Pin a version for reproducible installs.
    # v0.4.x adds the durable outbox (results survive a platform outage) and
    # protocol v2 results; v0.3.0 images carry gitleaks and a semgrep that
    # fails to start, so do not go back to them.
    tag: "v0.4.2"
    pullPolicy: IfNotPresent
  # -- Display name the sensor registers with (platform mode: SENSOR_NAME).
  #    Defaults to the workload name. In daemon mode the sensor's name is the
  #    one given when it was created in the UI.
  name: ""
  # -- REGION reported by the sensor.
  region: default
  # -- Override the API base URL (API_URL). Defaults to the in-cluster API
  #    service. It must reach the API directly: the sensor refuses redirects.
  apiUrl: ""
  # -- daemon mode: the sensor's API key (API_KEY). For production provide it
  #    out-of-band via existingSecret instead of committing it here.
  apiKey: ""
  # -- platform mode: bootstrap token for self-registration (BOOTSTRAP_TOKEN).
  bootstrapToken: ""
  # -- Name of a pre-created Secret holding the credential (the API key in
  #    daemon mode, the bootstrap token in platform mode). Takes precedence
  #    over apiKey/bootstrapToken; nothing secret is then rendered by Helm.
  existingSecret: ""
  # -- Key within the secret. Empty: "api-key" (daemon), "bootstrap-token"
  #    (platform).
  existingSecretKey: ""
  # -- daemon mode: comma-separated scanners the sensor offers for dispatched
  #    jobs (-tools). The default image carries semgrep, betterleaks, trivy
  #    and nuclei ("gitleaks" is still accepted and runs betterleaks).
  tools: "nuclei"
  # -- Renew the sensor API key before it expires and when the platform asks
  #    (PLATFORM_KEY_AUTORENEW; takes effect when the API sets SENSOR_KEY_TTL).
  #    The renewed key is written to the pod filesystem, not the Secret, so in
  #    daemon mode a pod restart after a renewal starts with the revoked key —
  #    leave this off unless the API key does not need to survive restarts.
  keyAutoRenew: false
  verbose: false
  # -- SENSOR_ALLOW_PRIVATE_TARGETS. Empty (default): RFC1918 / IPv6 ULA
  #    targets are refused — co-located sensors are for external-reachable
  #    work; internal scanning belongs on a remote sensor. "1": allow private
  #    targets. Loopback, link-local/IMDS and CGNAT stay blocked either way.
  #    The sensor only recognises "1", so any other value fails the render.
  #    (Reaching the in-cluster API needs no setting: since sdk-go v0.7.2 the
  #    sensor's API client allows the platform's private address.)
  allowPrivateTargets: ""
  # -- SENSOR_SCAN_ROOTS: ':'-separated directories that filesystem targets of
  #    dispatched code scans (betterleaks, semgrep, trivy fs) must resolve inside.
  #    Empty: the sensor's working directory (/scan in the image).
  scanRoots: ""
  # -- The sensor's outbox: results kept at /var/lib/openctem/outbox until the
  #    platform accepted them (sensor >= v0.4.0), so an API outage or a pod
  #    restart loses nothing. By default it is an emptyDir, which survives a
  #    container restart but NOT a pod deletion, reschedule or upgrade:
  #    results still queued then are lost. Enable persistence for a PVC.
  outbox:
    persistence:
      # -- Back the outbox with a PersistentVolumeClaim. Needs
      #    replicaCount 1 (one sensor process per outbox) and switches the
      #    Deployment to the Recreate strategy (a ReadWriteOnce volume).
      enabled: false
      # -- Use this pre-created claim instead of creating one.
      existingClaim: ""
      size: 2Gi
      # -- Empty: the cluster's default StorageClass.
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      # -- fsGroup given to the pod (unless podSecurityContext sets one) so
      #    the image's user (uid/gid 999) can write the volume.
      fsGroup: 999
    # -- emptyDir size limit when persistence is off (empty: none).
    emptyDirSizeLimit: ""
    # -- SENSOR_OUTBOX_MAX_BYTES (empty: the sensor's default, 1GiB and at
    #    most half of the free space). Keep it below the volume size.
    maxBytes: ""
    # -- SENSOR_OUTBOX_MAX_AGE (empty: 168h).
    maxAge: ""
  # -- platform mode: maximum concurrent jobs (-max-concurrent).
  maxConcurrent: 5
  # -- platform mode: which executor capabilities the sensor advertises
  #    (-enable-<name>).
  executors:
    recon: false
    vulnscan: true
    secrets: false
    assets: false
    pipeline: false
  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

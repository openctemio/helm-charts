# Old values that point the agent at a pre-created Secret, with sensor:
# naming the same Secret once it holds an API key: it is used unchanged (same
# name, same key), and the chart renders no Secret.
api:
  appEnv: development
agent:
  enabled: true
  existingSecret: my-agent-token
  existingSecretKey: token
  allowPrivateTargets: true
sensor:
  existingSecret: my-agent-token
